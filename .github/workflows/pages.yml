name: Pages

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# One deploy at a time; a queued deploy is not cancelled mid-flight.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: astro check
        run: bunx astro check
      - name: Tests
        run: bun test
      - name: Build (with the path collision check)
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the browser for the end-to-end tests
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests (against the production build)
        run: bun run test:e2e
      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
