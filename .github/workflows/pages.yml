name: Pages

on:
  push:
    branches: [master]
  pull_request:
  # Daily rebuild picks up new release versions; the minute is off the hour.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. A newer commit on a pull request cancels that PR's
# older run; every other event (master push, schedule, dispatch) deploys, so it
# is never cancelled and a newer one queues behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Chromium and its system libraries ship in the image, so nothing installs
    # them at run time. The tag must match @playwright/test (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Playwright image matches @playwright/test
        run: |
          want="$(bun -e 'console.log(require("./package.json").devDependencies["@playwright/test"])')"
          grep -q "image: mcr.microsoft.com/playwright:v$want-noble" .github/workflows/pages.yml
      - name: Resume drift check
        run: bun scripts/check-resume.ts
      - name: Biome
        run: bunx biome ci .
      - name: astro check
        run: bunx astro check
      - name: Tests
        run: bun test
      # The build drives Chromium too: it prints the resume PDF, captures the share
      # cards and measures the first load; the image already has the browser.
      # The workflow's own token (contents: read, set above) is the only credential:
      # the project facts and the collision check read public repositories with it.
      - name: Build (projects, PDF, share cards, then the checks and load budgets)
        run: bun run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The shards test this exact build; hidden files are kept so dist is whole.
      - name: Keep dist for the end-to-end shards
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 1
      - name: Upload the Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The end-to-end tests, 4 shards in parallel against the build's dist. Two
  # workers per shard (playwright.config.ts): a busier runner slows the CRT's
  # frames and makes the timing tests flaky.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: End-to-end tests (shard ${{ matrix.shard }} of 4, against the production build)
        run: bunx playwright test --shard=${{ matrix.shard }}/4 --workers=2

  deploy:
    needs: [build, e2e]
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Only job with contents: write. Runs on the schedule only, and commits a
  # timestamp when master has had no commit for over 50 days, so GitHub does not
  # disable the schedule. Uses the workflow's own token; no PAT.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: age
        run: bun scripts/keepalive.ts
      - name: Commit the timestamp
        if: steps.age.outputs.commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keep the schedule alive"
          git push origin HEAD:master
