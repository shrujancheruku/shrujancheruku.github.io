<!doctype html>
<!--
  PROTOTYPE — throwaway. Not the site, not the stack.
  Question (ticket "Windows of the sabbatical, stance, timeline and contact workspaces"): which windows each of
  the four remaining workspaces holds and how they tile on desktop and touch, in the approved desktop style
  (take D of prototype/desktop-layout). Sabbatical: photo slots, their shape, whether a photo is its own window.
  Stance: how much room the text gets (measured live, in words). Timeline: the five entries, the Illinois
  section's cue and opening animation, the skills window. Contact: how the one terminal sits.
  Three takes, switchable via ?variant=A|B|C, the switcher, or ← →. Opening and projects are copied from take D unchanged.
  Photos and the stance text are placeholders. Keys: t theme · c CRT · s spec panel · i open/close Illinois.
  Run: cd prototype/workspace-windows && bun run view  →  http://localhost:4519/workspace-windows/
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · workspace windows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontcss" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y mandatory}
body{-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg);transition:background .45s;--gap:14px;--mono:'IBM Plex Mono',monospace;font-family:var(--mono)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.snap{height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always}
[data-act]{cursor:pointer}
.m{display:none}
@media (max-width:760px){.d{display:none!important}.m{display:inline}body{--gap:10px}}

/* ---------- desktop skeleton (take D) ---------- */
.screen{position:fixed;inset:var(--bz,0px);border-radius:var(--br,0px);overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transition:background .45s,color .45s}
.bar{margin:14px 14px 7px;height:36px;flex:none;border:1px solid var(--line);border-radius:18px;background:var(--dim);padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:500 12.5px var(--mono);transition:background .45s,border-color .45s}
.ws{display:flex;gap:2px}
.ws b{height:24px;line-height:24px;padding:0 10px;border-radius:12px;font-weight:500;transition:background .3s,color .3s}
.ws b:hover{background:var(--bg)} .ws b.on{background:var(--ac);color:var(--bg)}
.rt{display:flex;align-items:center;gap:14px;padding-right:2px}
.rt [data-act]:hover{color:var(--ac)}
.chip{white-space:nowrap;display:flex;align-items:center;gap:7px;background:var(--ac);border-radius:13px;height:26px;padding:0 11px 0 6px;color:var(--bg);font-weight:700;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 35%,transparent),0 0 14px 2px color-mix(in srgb,var(--ac) 45%,transparent);transition:box-shadow .2s,transform .2s}
.chip:hover{transform:scale(1.04)} .rt .chip:hover{color:var(--bg)}
.chip i{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--bg) 0 50%,var(--hot) 0);box-shadow:0 0 0 1.5px var(--bg)}
body.idle .halo{animation:halo 2s ease-in-out 1s infinite}
@keyframes halo{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 55%,transparent),0 0 24px 7px color-mix(in srgb,var(--ac) 60%,transparent)}}
#themes{position:absolute;z-index:30;visibility:hidden;opacity:0;right:10px;top:54px;transform:translateY(-8px);width:min(460px,calc(100% - 20px));background:var(--dim);border:1px solid var(--line);border-radius:16px;padding:12px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:0 20px 60px #0008;font:12px var(--mono);transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1),visibility 0s .3s}
#themes.on{visibility:visible;opacity:1;transform:none;transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1)}
#themes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:10px}
#themes button.on{background:var(--bg);color:var(--ac)}
#themes button i{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.area{position:relative;flex:1;min-height:0;margin:0 7px 7px}
.pane{position:absolute;padding:calc(var(--gap)/2);visibility:hidden}
.win{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border:2px solid var(--dim);border-radius:14px;transition:border-color .3s,background .45s}
.pane.focus .win{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--ac),var(--hot)) border-box}
.tt{position:absolute;top:10px;left:16px;right:16px;z-index:2;font:11px var(--mono);opacity:.4;pointer-events:none;display:flex;justify-content:space-between}
.win:has(.comp) .tt,.win:has(.b-copy) .tt,.win:has(.photo) .tt{display:none}
.body{position:relative;flex:1;min-height:0;container-type:size}
.comp iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;display:block}
.dimt{opacity:.55}
.ac{color:var(--ac)}
/* opening */
.b-name{position:absolute;inset:0;padding:0 4cqw 0 5cqw;display:flex;flex-direction:column;justify-content:center}
.b-name h1{font:700 min(15cqw,30cqh)/.95 var(--mono);letter-spacing:-.045em}
.b-name h1 span{display:block}
.b-name .lab{margin-top:3cqh;font:400 14px var(--mono);color:var(--ac)} .b-name .lab::before{content:"// "}
.b-term{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;white-space:pre-wrap;padding:34px 18px 16px;font:400 14px/1.6 var(--mono)}
.b-term .p{color:var(--hot)} .cur{background:var(--fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.b-term a{color:var(--ac)} .b-term a:hover{text-decoration:underline}
.b-term .k{display:inline-block;width:10ch;opacity:.55}
.b-term button{color:var(--ac);opacity:.8}
.b-now{position:absolute;inset:0;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;font:400 14px/1.6 var(--mono)}
.b-now b{color:var(--ac);font-weight:500}
/* project copy + stack */
.b-copy{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding:28px 24px 22px 5cqw;gap:12px}
.b-copy .kick{font:400 12px var(--mono);opacity:.55}
.b-copy h2{font:700 clamp(28px,13cqw,52px)/1 var(--mono);letter-spacing:-.05em}
.b-copy .pitch{font:500 16px/1.45 var(--mono)}
.b-copy ul{list-style:none;font:400 13px/1.6 var(--mono)} .b-copy ul li::before{content:"+ ";color:var(--ac)}
.b-copy .meta{font:400 12px var(--mono);opacity:.55;margin-top:auto}
.b-copy .links{display:flex;gap:1.4em;flex-wrap:wrap;font:500 13px var(--mono)} .b-copy .links a{color:var(--ac)} .b-copy .links a::before{content:"→ "}
.b-copy .more{color:var(--ac)}
.b-stack{position:absolute;inset:32px 0 0;border-top:1px solid var(--dim);font:400 13px/1 var(--mono);display:flex;flex-direction:column}
.b-stack > *{padding:0 14px;flex:1;max-height:34px;display:flex;align-items:center;border-bottom:1px solid var(--dim);gap:1ch;white-space:nowrap;overflow:hidden}
.b-stack > :last-child{border-bottom:0}
.b-stack .on{background:var(--dim);color:var(--ac)} .b-stack .on::before{content:"▸"} .b-stack > :not(.on)::before{content:" ";white-space:pre}
.b-stack .more{opacity:.6}
/* archive */
#arch{position:absolute;z-index:20;left:50%;top:50%;width:min(720px,calc(100% - 24px));height:min(560px,calc(100% - 24px));padding:0;
  transform:translate(-50%,-50%) scale(.94);opacity:0;visibility:hidden;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.2,1),visibility 0s .35s}
#arch.on{opacity:1;visibility:visible;transform:translate(-50%,-50%);transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.2,1)}
#arch .win{box-shadow:0 30px 90px #000b;border-color:var(--ac)}
.b-arch{overflow:auto;padding:34px 16px 16px;font:13px/1.5 var(--mono)}
.b-arch .e{display:grid;grid-template-columns:1fr auto;gap:.25em 1em;padding:1em 0;border-bottom:1px solid var(--dim)}
.b-arch .e .n{color:var(--ac);font-weight:700} .b-arch .e .mt{opacity:.55;text-align:right;font-size:12px} .b-arch .e p{grid-column:1/-1}

/* ---------- the four workspaces (new) ---------- */
.wh{font:700 clamp(28px,7cqw,52px)/1 var(--mono);letter-spacing:-.05em}
.tag{display:inline-block;font:400 11px/1 var(--mono);padding:3px 7px;border:1px solid var(--line);border-radius:9px;margin:0 4px 4px 0;opacity:.85}
.tag.k{border-color:var(--ac);color:var(--ac)}
/* photos: placeholders until supplied */
.photo{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(60% 50% at 70% 30%,color-mix(in srgb,var(--ac) 45%,transparent),transparent 70%),
  linear-gradient(170deg,color-mix(in srgb,var(--hot) 22%,var(--dim)),var(--dim) 55%,color-mix(in srgb,var(--fg) 12%,var(--dim)))}
.photo::before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:46%;background:color-mix(in srgb,var(--bg) 70%,var(--dim));clip-path:polygon(0 60%,18% 25%,32% 50%,52% 8%,70% 44%,84% 22%,100% 52%,100% 100%,0 100%)}
.photo .pi{position:absolute;top:12px;left:14px;font:11px var(--mono);opacity:.6}
.photo .cap{position:absolute;left:14px;right:14px;bottom:12px;font:500 12px var(--mono);color:var(--fg);display:flex;justify-content:space-between;gap:1em}
.photo .cap span:last-child{opacity:.6}
/* timeline entries */
.te{display:grid;grid-template-columns:19ch 1fr;column-gap:2ch;padding:14px 0;border-bottom:1px solid var(--dim);position:relative}
.te:last-child{border-bottom:0}
.te .when{font:400 12px/1.6 var(--mono);opacity:.6;grid-column:1} .te .title{font:700 15px/1.6 var(--mono);grid-column:2}
.te .org{grid-column:2;color:var(--ac);font:500 13px/1.6 var(--mono)}
.te p{grid-column:2;font:400 13px/1.6 var(--mono);opacity:.85;margin:.3em 0 .5em;max-width:68ch}
.te .tech{grid-column:2}
.te .row{display:contents}
.te.now .title{color:var(--ac)}
/* Illinois */
.il-h .deg{font:700 15px/1.4 var(--mono)} .il-h .uni{color:var(--ac);font:500 13px/1.5 var(--mono)} .il-h .sub{font:12px/1.6 var(--mono);opacity:.6}
.cue{display:inline-flex;align-items:center;gap:1ch;margin-top:12px;font:500 13px var(--mono);color:var(--bg);background:var(--ac);padding:6px 12px;border-radius:14px;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 30%,transparent)}
.cue .chev{display:inline-block;transition:transform .35s}
.il-open .cue .chev{transform:rotate(90deg)}
.cue:hover{transform:translateX(2px)}
.il-body{overflow:hidden}
.il-body .te{grid-template-columns:16ch 1fr}
/* skills */
.sk{display:grid;grid-template-columns:auto 1fr;gap:6px 1.5ch;align-items:center;font:400 12.5px var(--mono)}
.sk i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--hot));transform-origin:left}
.sk-more{font:400 12.5px/1.7 var(--mono);margin-top:14px} .sk-more b{font-weight:500;opacity:.55;display:inline-block;width:10ch}
/* stance */
.stance{position:absolute;inset:0;overflow:hidden;padding:38px 28px 24px}
.stance .txt p{margin-bottom:.9em}
.room{position:absolute;right:14px;bottom:10px;z-index:3;font:500 11px var(--mono);background:var(--ac);color:var(--bg);padding:3px 8px;border-radius:9px;opacity:.9}

/* ===== A · Tiles: everything visible at once, one step per workspace ===== */
.vA .sc .b-copy{justify-content:flex-end}
.vA .sx .stance .txt{font:400 15px/1.65 var(--mono);max-width:72ch}
.vA .sh{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 24px 5cqw}
.vA .sh h2{font:700 min(13cqw,16cqh)/.95 var(--mono);letter-spacing:-.05em}
.vA .sh p{margin-top:14px;font:500 16px/1.45 var(--mono);max-width:30ch}
.b-tl{position:absolute;inset:0;overflow:auto;padding:38px 24px 8px 5cqw;scrollbar-width:thin}
.b-il{position:absolute;inset:0;overflow:auto;padding:38px 22px 16px;scrollbar-width:thin}
.b-sk{position:absolute;inset:0;overflow:auto;padding:38px 22px 16px}
.vA .ctpane .b-term{justify-content:center;padding:40px 36px;font-size:15px}

/* ===== B · Steps: one subject per step, master + stack like the projects ===== */
.ptrack{position:absolute;inset:0}
.ptrack .photo{visibility:hidden}
.vB .sx .stance{display:flex;flex-direction:column;justify-content:center;padding:40px max(28px,8cqw)}
.vB .sx .stance .txt{font:500 clamp(17px,2.2cqw,22px)/1.5 var(--mono);max-width:52ch}
.vB .sx .stance .wh{margin-bottom:.7em}
.tk{position:absolute;inset:32px 0 0;border-top:1px solid var(--dim);overflow:auto;font:400 13px/1.3 var(--mono);scrollbar-width:thin}
.tk .it{display:grid;grid-template-columns:2ch 1fr;padding:9px 14px;border-bottom:1px solid var(--dim);cursor:pointer}
.tk .it .dt{opacity:.55;font-size:11.5px;grid-column:2} .tk .it .t{grid-column:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .it.on{background:var(--dim);color:var(--ac)} .tk .it.on::before{content:"▸"}
.tk .ilg{padding:10px 14px 12px;border-bottom:1px solid var(--dim)}
.tk .ilg .cue{margin-top:8px}
.tk .il-body .it{padding-left:28px}
.td{position:absolute;inset:0;padding:38px 32px 28px 5cqw;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;overflow:hidden}
.td .dd{font:400 13px/1.6 var(--mono);opacity:.6}
.td h2{font:700 clamp(28px,7cqw,52px)/1 var(--mono);letter-spacing:-.05em}
.td h2 small{display:block;font-size:.5em;letter-spacing:-.02em;opacity:.6;margin-top:.2em}
.td .og{color:var(--ac);font:500 16px var(--mono)}
.td p{font:500 16px/1.45 var(--mono);max-width:56ch}
.td .kicker{font:400 12px var(--mono);opacity:.55;margin-bottom:auto}
.vB .b-sk{padding-top:34px}
.vB .ctpane .b-term{justify-content:flex-start;padding:40px 28px;font-size:15px}

/* ===== C · Scratchpad: floating, draggable photos, a pager, a horizontal axis that rewinds ===== */
.vC .pphoto .win{box-shadow:0 18px 50px #0007}
.vC .pphoto{cursor:grab} .vC .pphoto:active{cursor:grabbing}
.pager{position:absolute;inset:0;overflow:auto;padding:38px 28px 40px;scrollbar-width:thin}
.pager .txt{font:400 14px/1.7 var(--mono);max-width:68ch}.pager .txt p{margin-bottom:.9em}
.pager .wh{margin-bottom:.6em}
.pager-end{opacity:.5;font:12px var(--mono);margin-top:1em}
.axis{position:absolute;inset:0;padding:36px 22px 14px}
.ax{position:relative;height:100%}
.ax .yr{position:absolute;top:0;bottom:0;border-left:1px dashed var(--dim);font:11px var(--mono);opacity:.7;padding-left:4px}
.ax .yr span{position:absolute;bottom:0}
.ax .lane{position:absolute;left:0;right:0;height:30%}
.ax .lab2{position:absolute;left:0;font:11px var(--mono);opacity:.5;transform:translateY(-120%)}
.ax .blk{position:absolute;top:0;bottom:0;border-radius:8px;background:var(--dim);border:1.5px solid var(--line);padding:6px 8px;font:500 12px/1.2 var(--mono);overflow:hidden;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s}
.ax .blk:hover{border-color:var(--ac)}
.ax .blk.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.ax .blk.deg{background:none;border-style:dashed;opacity:.8}
.ax .blk.now{background:repeating-linear-gradient(135deg,var(--dim) 0 6px,transparent 6px 12px)}
.ax .blk.now.on{background:var(--ac)}
.rewind{position:absolute;left:0;bottom:0;transform:translateY(0)}
.vC .ctpane .b-term{justify-content:flex-start;padding:40px 28px;font-size:15px}

@media (max-width:760px){
  .bar{height:40px;border-radius:20px;margin:8px 8px 6px}
  .ws b{padding:0 9px;height:28px;line-height:28px;border-radius:14px}
  .area{margin:0 5px 5px}
  .b-copy{padding:18px 16px 14px;gap:8px} .b-copy ul{display:none}
  .b-term{padding:30px 14px 12px;font-size:12.5px} .b-now{font-size:12.5px;padding:10px 12px}
  .b-stack > *{max-height:none}
  #themes{left:8px;right:8px;width:auto;top:56px}
  .te{grid-template-columns:1fr;padding:12px 0} .te .when,.te .title,.te .org,.te p,.te .tech{grid-column:1}
  .te .row{display:block}
  .il-body .te{grid-template-columns:1fr}
  .b-tl,.b-il,.b-sk{padding:32px 14px 10px}
  .stance{padding:32px 16px 16px}
  .vA .sx .stance .txt{font-size:13.5px}
  .vB .sx .stance{padding:32px 18px}
  .vB .sx .stance .txt{font-size:15px}
  .td{padding:30px 16px 16px;gap:8px} .td p{font-size:14px}
  .pager{padding:32px 16px 30px} .pager .txt{font-size:13px}
  .axis{padding:30px 10px 10px}
  .vA .ctpane .b-term,.vB .ctpane .b-term,.vC .ctpane .b-term{padding:30px 14px;font-size:12.5px}
  .vA .sh{padding:0 16px 16px} .vA .sh p{font-size:14px}
}

/* CRT (take D): bezel + one WebGL 2 overlay canvas, no curvature */
#crtc{position:absolute;inset:0;width:100%;height:100%;z-index:50;pointer-events:none;mix-blend-mode:multiply;display:none}
body.crt{background:radial-gradient(120% 120% at 50% 40%,#2a2a2d,#0c0c0e 70%);--bz:26px;--br:26px}
body.crt #crtc{display:block}
@media (max-width:760px){body.crt{--bz:8px;--br:16px}}
body.crt .screen{text-shadow:0 0 .45em color-mix(in srgb,currentColor 40%,transparent);box-shadow:0 0 0 2px #000,0 0 0 6px #1d1d20,0 0 40px 6px color-mix(in srgb,var(--ac) 14%,transparent)}
body.crt .screen::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:55;box-shadow:inset 0 0 28px 0 #0004,inset 0 0 0 2px #0007;background:linear-gradient(160deg,#ffffff0d,transparent 38%)}

/* ---------- switcher + spec (not part of any design) ---------- */
#sw{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:6px;background:#111;color:#fff;border:1px solid #555;border-radius:999px;padding:5px 7px;
  font:500 12px/1 system-ui,sans-serif;box-shadow:0 8px 30px #0008;text-shadow:none;white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
#sw button,#sw select{all:unset;cursor:pointer;height:26px;min-width:26px;padding:0 8px;border-radius:13px;text-align:center;line-height:26px;background:#2a2a2a}
#sw button:hover,#sw button.on{background:#ffd400;color:#000}
#sw #lab{padding:0 6px} #sw i{width:1px;height:18px;background:#555}
#sw.min > :not(#hide){display:none}
@media (max-width:760px){#sw{flex-wrap:wrap;justify-content:center;border-radius:16px;font-size:11px;width:calc(100vw - 16px);bottom:8px}#sw i{display:none}}
#spec{position:fixed;z-index:9998;right:14px;bottom:60px;width:min(400px,calc(100vw - 28px));max-height:calc(100vh - 120px);overflow:auto;background:#111e;color:#eee;border:1px solid #555;border-radius:12px;
  padding:14px 16px;font:12px/1.55 system-ui,sans-serif;display:none;text-shadow:none}
#spec.on{display:block}
#spec h4{font-size:12px;color:#ffd400;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
#spec td{padding:1px 10px 1px 0;vertical-align:top} #spec td:first-child{opacity:.6;white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>
<div id="sw"><button id="vp">←</button><span id="lab"></span><button id="vn">→</button><i></i>
  <select id="ts" title="theme (t)"></select><button id="cb" title="CRT (c)"></button><button id="ib" title="Illinois (i)">illinois</button>
  <button id="sb" title="spec (s)">spec</button><button id="hide" title="collapse">–</button></div>
<div id="spec"></div>

<script>
/* ---------------- data ---------------- */
const THEMES={
  'tokyo-night':{bg:'#1a1b26',fg:'#c0caf5',ac:'#7aa2f7',dim:'#24283b',line:'#3b4261',hot:'#f7768e'},
  'gruvbox':    {bg:'#282828',fg:'#d4be98',ac:'#7daea3',dim:'#3c3836',line:'#665c54',hot:'#ea6962'},
  'paper':      {bg:'#f2eede',fg:'#222222',ac:'#cc3e28',dim:'#d8d3c0',line:'#b9b29b',hot:'#216609'},

function typer(el,max=9){let q=Promise.resolve();
  return (cmd,outs=[],fast)=>q=q.then(()=>new Promise(res=>{
    const line=document.createElement('div');line.innerHTML='<span class="p">❯ </span><span class="c"></span><span class="cur"> </span>';el.append(line);
    const c=line.querySelector('.c');let i=0;
    const done=()=>{line.querySelector('.cur')?.remove();outs.forEach(o=>{const d=document.createElement('div');d.innerHTML=o;el.append(d)});while(el.children.length>max)el.firstChild.remove();res()};
    if(fast){c.textContent=cmd;return done()}
    const iv=setInterval(()=>{c.textContent=cmd.slice(0,++i);if(i>=cmd.length){clearInterval(iv);setTimeout(done,240)}},42)}))}

  const L=layoutOf(s),area=$('.area').getBoundingClientRect(),gap=parseFloat(getComputedStyle(document.body).getPropertyValue('--gap'));
  let z=1;
  for(const el of PANES){const id=el.id.slice(2),r=L[id];
    if(r){let h=r[3]+'%';
      if(typeof r[3]==='string'){const [a,b]=r[3].split(':').map(Number);h=((r[2]/100*area.width-gap)*b/a+gap)+'px'}
      const to={left:r[0]+'%',top:r[1]+'%',width:r[2]+'%',height:h,rotation:r[4]||0,x:0,y:0,zIndex:z++};
      if(!el._vis)gsap.set(el,{...to,scale:.94,autoAlpha:0,y:typeof r[3]==='string'?40:0});
      gsap.to(el,{...to,scale:1,autoAlpha:1,duration:dur,delay:dur?(r[5]||0):0,ease:'expo.out',overwrite:true});el._vis=true}
    else{if(el._vis)gsap.to(el,{autoAlpha:0,scale:.94,duration:dur*.45,overwrite:true});else gsap.set(el,{autoAlpha:0});el._vis=false}
    el.classList.toggle('focus',S[s].f===id)}
  $$('.ws b').forEach((b,i)=>b.classList.toggle('on',i===S[s].ws));
  $$('.b-stack [data-p]').forEach(d=>d.classList.toggle('on',+d.dataset.p===s));
  if(S[s].fit)setTimeout(fit,dur*1000+60);
}
const go=s=>scrollTo({top:s*innerHeight,behavior:'smooth'});
function onScroll(){const s=Math.max(0,Math.min(STEPS-1,Math.round(scrollY/innerHeight)));if(s===step)return;
  const prev=step;step=s;
  if(ilOpen&&S[s].ws!==4){ilOpen=false;ilRender(0)}
  place(s,prev<0?0:.85);
  if(s===1&&prev!==1)followComps();
  if(prev>=0){if(s===1&&prev<1)type('open unmacos');if(s===2&&prev===1)type('open orca-flow');if(s===0&&prev>0)type('cd ~')}
  if(S[s].ws===5&&!contacted){contacted=true;ctype('contact',CONTACT)}
  if(S[s].ph!==undefined)setPhoto(S[s].ph);
  if(S[s].ws===4)enterTimeline();
  label()}
addEventListener('scroll',onScroll,{passive:true});
mq.addEventListener('change',()=>{place(step,.5);if(vk==='C')drawAxis()});
addEventListener('resize',()=>{crtResize();clearTimeout(rz);rz=setTimeout(()=>{place(step,0);if(vk==='C')drawAxis()},120)});let rz;

/* ---------------- stance: how many words fit, measured in the window ---------------- */
let room=0;
function fit(){const box=$(S[step]?.fit||'#none');if(!box)return;const t=box.querySelector('.txt'),badge=box.parentElement.querySelector('.room');
  if(S[step].scroll){t.innerHTML=lorem(600);/* words on the first screen of the pager */
    const words=[...t.querySelectorAll('p')];t.innerHTML=lorem(1);let lo=0,hi=600;
    while(lo<hi){const mid=(lo+hi+1)>>1;t.innerHTML=lorem(mid);if(box.scrollHeight<=box.clientHeight+1)lo=mid;else hi=mid-1}
    room=lo;t.innerHTML=lorem(Math.max(lo*2,320));badge.textContent=`≈ ${lo} words per screen · scrolls`;pagerLabel();return}
  let lo=0,hi=900;while(lo<hi){const mid=(lo+hi+1)>>1;t.innerHTML=lorem(mid);if(box.scrollHeight<=box.clientHeight+1)lo=mid;else hi=mid-1}
  room=lo;t.innerHTML=lorem(lo);badge.textContent=`room: ≈ ${lo} words at ${innerWidth}×${innerHeight}`;label()}
function pagerLabel(){const p=$('.pager');if(!p)return;const pct=Math.round(100*p.scrollTop/Math.max(1,p.scrollHeight-p.clientHeight));
  $('#p-sx .tt').textContent=`less stance.md — ${isFinite(pct)?pct:0}%`}
$('.pager')?.addEventListener('scroll',pagerLabel,{passive:true});

/* ---------------- sabbatical photos ---------------- */
function setPhoto(i){if(i===phIdx)return;const ph=$$('.ptrack .photo'),dir=i>phIdx?1:-1;
  ph.forEach((p,j)=>{if(j===i)gsap.fromTo(p,{autoAlpha:0,scale:1.08,xPercent:6*dir},{autoAlpha:1,scale:1,xPercent:0,duration:.9,ease:'expo.out'});
    else if(j===phIdx)gsap.to(p,{autoAlpha:0,xPercent:-6*dir,duration:.5});else gsap.set(p,{autoAlpha:0})});
  phIdx=i;$$('#pstack [data-ph]').forEach(d=>d.classList.toggle('on',+d.dataset.ph===i))}
/* C: drag a photo (desktop only) */
let drag=null,zTop=100;
document.addEventListener('pointerdown',e=>{const p=e.target.closest('.pphoto');if(!p||mq.matches)return;
  drag={el:p,x:e.clientX-gsap.getProperty(p,'x'),y:e.clientY-gsap.getProperty(p,'y')};p.style.zIndex=++zTop;gsap.to(p,{scale:1.03,duration:.2});e.preventDefault()});
addEventListener('pointermove',e=>{if(drag)gsap.set(drag.el,{x:e.clientX-drag.x,y:e.clientY-drag.y})});
addEventListener('pointerup',()=>{if(drag){gsap.to(drag.el,{scale:1,duration:.3});drag=null}});

/* ---------------- timeline + Illinois ---------------- */
const pick=k=>typeof k==='string'&&k[0]==='i'?IL[+k.slice(1)]:k==='deg'?null:TL[+k];
function detail(k){const el=$('#tdB')||$('#tdC');if(!el)return;sel=k;
  if(k==='deg'){el.innerHTML=`<div class="kicker">illinois · 2014 – 2018</div><div class="dd">${ILH.yrs}</div><h2>${ILH.deg}</h2><div class="og">${ILH.uni}</div><p>${ILH.sub}</p>`}
  else{const e=pick(k);el.innerHTML=`<div class="kicker">${typeof k==='string'?'illinois · '+e.tag.toLowerCase():'timeline · '+(+k+1)+' / '+TL.length}</div>
    <div class="dd">${e.roles.map(r=>r[0]).join('<br>')}</div><h2>${e.roles[0][1]}${e.roles[1]?`<small>then ${e.roles[1][1]}</small>`:''}</h2>${e.org?`<div class="og">${e.org}</div>`:''}<p>${e.desc}</p>
    <div>${e.tag?tags([e.tag],1):''}${tags(e.tech)}</div>`}
  gsap.from(el.children,{y:14,opacity:0,duration:.6,stagger:.05,ease:'expo.out'});
  $$('[data-act="sel"]').forEach(d=>d.classList.toggle('on',d.dataset.i==String(k)));
  $$('.blk').forEach(d=>d.classList.toggle('on',d.dataset.i==String(k)))}
let tlEntered=false;
function enterTimeline(){if(tlEntered)return;tlEntered=true;
  if(vk!=='A')detail(sel);
  gsap.fromTo('.sk i',{scaleX:0},{scaleX:1,duration:1.1,ease:'expo.out',stagger:.08,delay:.4});
  if(vk==='A')gsap.from('#p-tl .te',{x:-18,opacity:0,duration:.7,stagger:.07,ease:'expo.out',delay:.25})}
function ilRender(animate){
  const host=$('#ilA')||$('#ilB');
  if(host){host.classList.toggle('il-open',ilOpen);host.querySelector('.cl').textContent=ilOpen?'hide':'4 earlier roles';
    const b=host.querySelector('.il-body'),kids=b.querySelectorAll('.te,.it');
    if(!animate){gsap.set(b,{height:ilOpen?'auto':0});return}
    if(ilOpen){gsap.fromTo(b,{height:0},{height:'auto',duration:.7,ease:'expo.out',delay:vk==='A'?.35:0});
      gsap.fromTo(kids,{y:16,opacity:0,filter:'blur(4px)'},{y:0,opacity:1,filter:'blur(0px)',duration:.7,stagger:.08,ease:'expo.out',delay:vk==='A'?.5:.12})}
    else gsap.to(b,{height:0,duration:.45,ease:'power3.inOut'})}
  if(vk==='B'&&animate)detail(ilOpen?'deg':1);
  if(vk==='C'){gsap.to(AX,{min:ilOpen?2013:2018.4,duration:animate?1.4:0,ease:'expo.inOut',onUpdate:drawAxis});
    $('#p-ta .tt').textContent=ilOpen?'timeline · 2013 → now':'timeline · 2018 → now';if(animate)detail(ilOpen?'deg':1)}}
function toggleIl(){if(S[step].ws!==4){go(WS_FIRST[4]);setTimeout(()=>{ilOpen=true;ilRender(1);place(step,.85)},900);return}
  ilOpen=!ilOpen;place(step,.85);ilRender(1);label()}
/* C: the axis */
const AX={min:2018.4,max:2026.95};
function drawAxis(){const ax=$('#ax');if(!ax)return;const X=t=>(t-AX.min)/(AX.max-AX.min)*100;
  let h='';for(let y=Math.ceil(AX.min);y<=2026;y++){const x=X(y);if(x<0)continue;h+=`<div class="yr" style="left:${x}%"><span>${mq.matches?"'"+String(y).slice(2):y}</span></div>`}
  const blk=(s,e,label,i,cls='')=>{const l=X(s),w=X(e)-l;return w<=0||l+w<0?'':`<div class="blk ${cls}" data-act="sel" data-i="${i}" style="left:${Math.max(l,0)}%;width:${w+Math.min(l,0)}%" title="${label}">${label}</div>`};
  h+=`<div class="lane" style="top:${ilOpen?'10%':'22%'}"><span class="lab2">career</span>`;
  TL.forEach((e,i)=>{if(e.roles.length>1){h+=blk(e.s,2022.33,e.org+' · '+e.roles[1][1],i)+blk(2022.33,e.e,e.roles[0][1],i)}else h+=blk(e.s,e.e,e.org||'sabbatical',i,e.now?'now':'')});
  h+='</div>';
  if(AX.min<2018.3){h+=`<div class="lane" style="top:48%"><span class="lab2">illinois</span>${blk(ILH.s,ILH.e,'B.Sc Computer Science','deg','deg')}${IL.map((e,i)=>blk(e.s,e.e,e.org,'i'+i)).join('')}</div>`}
  h+=`<button class="cue rewind" data-act="il" style="${ilOpen?'':''}"><span class="chev">${ilOpen?'▸':'◂'}</span>${ilOpen?'back to 2018':'illinois · 2013 – 2018'}</button>`;
  ax.innerHTML=h;$$('.blk').forEach(d=>d.classList.toggle('on',d.dataset.i==String(sel)))}
if(vk==='C')drawAxis();

/* ---------------- theme ---------------- */
function applyTheme(){const t=THEMES[theme];for(const k in t)document.documentElement.style.setProperty('--'+k,t[k]);
  $$('[data-theme-name]').forEach(e=>e.textContent=theme);$$('#themes [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===theme));
  $('#ts').value=theme;followComps();save();label()}
const cycle=()=>{picked=true;theme=TK[(TK.indexOf(theme)+1)%TK.length];applyTheme()};
function followComps(){const t=THEMES[theme];
  $$('iframe[data-own]').forEach(f=>{try{f.contentWindow.startTheme?.(theme,[t.bg,t.fg,t.ac,t.dim])}catch{}});
  $$('iframe[data-comp]:not([data-own])').forEach(f=>{const d=f.contentDocument;if(!d||!d.head)return;let s=d.getElementById('follow');
    if(!s){s=d.createElement('style');s.id='follow';d.head.append(s);const l=d.createElement('link');l.rel='stylesheet';l.href=$('#fontcss').href;d.head.append(l)}
    s.textContent=`body{--bg:${t.bg}!important;--fg:${t.fg}!important;--ac:${t.ac}!important;--dim:${t.dim}!important;background:var(--bg)!important;color:var(--fg)!important;font-family:'IBM Plex Mono',monospace!important}
      .term,.tile,.menu,.sb,.keys{font-family:inherit!important}.desk{background:linear-gradient(var(--dim),var(--bg))!important}.monitor .screen{background:var(--bg)!important}`})}
$$('iframe[data-comp]').forEach(f=>f.addEventListener('load',followComps));

/* ---------------- interactions ---------------- */
const arch=on=>$('#arch').classList.toggle('on',on??!$('#arch').classList.contains('on'));
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');
  if(!a){if(!e.target.closest('#themes'))$('#themes').classList.remove('on');return}
  const act=a.dataset.act;
  if(act==='ws')go(WS_FIRST[+a.dataset.w]);
  if(act==='go')go(+a.dataset.s);
  if(act==='archive')arch();
  if(act==='arch-close')arch(false);
  if(act==='theme-ui'){e.stopPropagation();$('#themes').classList.toggle('on')}
  if(act==='theme-set'){picked=true;theme=a.dataset.t;applyTheme()}
  if(act==='il')toggleIl();
  if(act==='sel'){const k=a.dataset.i;detail(/^\d$/.test(k)?+k:k)}
  if(act==='copy'){navigator.clipboard?.writeText('shrujancheruku@gmail.com');ctype('',['copied to clipboard'],true)}
});
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;
  if(e.key==='ArrowLeft')sw(-1);if(e.key==='ArrowRight')sw(1);
  if(e.key==='t')cycle();if(e.key==='c')setCrt(1-crt);if(e.key==='i')toggleIl();
  if(e.key==='s')$('#spec').classList.toggle('on');
  if(e.key==='Escape'){arch(false);$('#themes').classList.remove('on')}});
const clock=()=>$$('.clock').forEach(c=>c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));clock();setInterval(clock,10000);

/* ---------------- CRT: WebGL 2 overlay (take D, no curvature) ---------------- */
const cv=$('#crtc'),gl=cv.getContext('webgl2',{alpha:false,antialias:false,premultipliedAlpha:false});
let uR,uT,uD;
if(gl){const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,`#version 300 es
    void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,`#version 300 es
    precision highp float;uniform vec2 R;uniform float T,D;out vec4 o;
    void main(){vec2 uv=gl_FragCoord.xy/R;vec2 p=gl_FragCoord.xy/D;
      float s=.5+.5*cos(p.y*6.2831853/3.);float scan=1.-.24*(1.-s)*(1.-s);
      float c=mod(floor(p.x),3.);vec3 m=c<1.?vec3(1.,.84,.84):c<2.?vec3(.84,1.,.84):vec3(.84,.84,1.);
      float v=mix(.9,1.,pow(16.*uv.x*uv.y*(1.-uv.x)*(1.-uv.y),.35)); /* soft vignette: corners floor at 90% */
      float band=1.-.05*exp(-pow((fract(T*.07)*1.4-.2-(1.-uv.y))*9.,2.));
      float fl=.988+.012*sin(T*97.)*sin(T*13.);
      o=vec4(m*scan*v*band*fl,1.);}`));
  gl.linkProgram(prog);gl.useProgram(prog);uR=gl.getUniformLocation(prog,'R');uT=gl.getUniformLocation(prog,'T');uD=gl.getUniformLocation(prog,'D')}
function crtResize(){if(!gl)return;const d=devicePixelRatio||1;cv.width=cv.clientWidth*d|0;cv.height=cv.clientHeight*d|0;gl.viewport(0,0,cv.width,cv.height)}
function setCrt(n){crt=n;document.body.classList.toggle('crt',crt>0);requestAnimationFrame(()=>{crtResize();place(step,0)});save();label()}
(function loop(t){if(gl&&crt>0){gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,t/1000);gl.uniform1f(uD,devicePixelRatio||1);gl.drawArrays(gl.TRIANGLES,0,3)}requestAnimationFrame(loop)})(performance.now());

/* ---------------- switcher + spec ---------------- */
const keys=Object.keys(V);
function sw(d){const u=new URL(location.href);u.searchParams.set('variant',keys[(keys.indexOf(vk)+d+keys.length)%keys.length]);u.hash='ws'+(step<0?0:S[step].ws);location.href=u}
$('#vp').onclick=()=>sw(-1);$('#vn').onclick=()=>sw(1);
$('#ts').innerHTML=TK.map(k=>`<option value="${k}">${k}</option>`).join('');
$('#ts').onchange=e=>{picked=true;theme=e.target.value;applyTheme()};
$('#cb').onclick=()=>setCrt(1-crt);$('#ib').onclick=toggleIl;
$('#sb').onclick=()=>$('#spec').classList.toggle('on');
$('#hide').onclick=()=>{$('#sw').classList.toggle('min');$('#hide').textContent=$('#sw').classList.contains('min')?'+':'–'};
function label(){
  $('#lab').textContent=`${vk} · ${v.name}`;
  $('#cb').textContent='CRT: '+['off','on'][crt];$('#cb').classList.toggle('on',crt>0);$('#ib').classList.toggle('on',ilOpen);
  $('#spec').innerHTML=`<b>${vk} · ${v.name}</b><table>${Object.entries(v.spec).map(([k,x])=>`<tr><td>${k}</td><td>${x}</td></tr>`).join('')}</table>
    <h4>state</h4><table><tr><td>workspace</td><td>${step<0?'-':S[step].ws+1+' · '+WS[S[step].ws]} (step ${step+1} / ${STEPS})</td></tr>
    <tr><td>Illinois</td><td>${ilOpen?'open':'closed'}</td></tr><tr><td>stance room</td><td>${room?'≈ '+room+' words (last measured)':'enter the stance workspace'}</td></tr>
    <tr><td>layout</td><td>${mq.matches?'touch (one column)':'desktop'} · ${innerWidth}×${innerHeight}</td></tr><tr><td>theme</td><td>${theme}</td></tr></table>
    <h4>placeholders</h4>photos · stance text (lorem) · skill bar lengths
    <h4>keys</h4>← → take · t theme · c CRT · i Illinois · s this panel · esc close`}

/* ---------------- boot ---------------- */
history.scrollRestoration='manual';
applyTheme();setCrt(crt);
const startWs=+(location.hash.match(/ws(\d)/)||[])[1]||0;
scrollTo(0,WS_FIRST[startWs]*innerHeight);onScroll();
gsap.from('.pane:not([style*="hidden"]) .win',{scale:.7,opacity:0,duration:.9,ease:'expo.out',stagger:.12});
</script>
