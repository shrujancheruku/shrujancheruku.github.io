<!doctype html>
<!--
  PROTOTYPE — throwaway. Not the site, not the stack.
  Question (ticket "Inside the archive window"): what the archive window looks like inside, where it appears and how
  big it is on desktop and touch, how each entry (name, pitch, main language, release version, links) is laid out,
  how it opens and closes, and whether it re-tiles the workspace or floats above it.
  Host: the approved desktop (take D of prototype/desktop-layout + take A of prototype/workspace-windows, five
  workspaces, contact as decided). Only the archive differs between takes.
  Four takes, switchable via ?variant=A|B|C|D, the switcher, or ← →. E (the default) is the founder's pick: B's re-tiling
  with A's list inside, no heading line, and no status bar item (opened only from the projects workspace).
  Keys: a open/close the archive · n 3 ↔ 9 entries (stress test) · t theme · c CRT · s spec panel · i Education & Internships · esc close.
  Archive entries 1–3 are the real archive with real GitHub facts; with n, rapid-radiology (as if replaced) and five
  placeholders are added. The archive window's heading line is placeholder wording.
  Run: cd prototype/archive-window && bun run view  →  http://localhost:4520/archive-window/
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · archive window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontcss" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y mandatory}
body{-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg);transition:background .45s;--gap:14px;--mono:'IBM Plex Mono',monospace;font-family:var(--mono)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.snap{height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always}
[data-act]{cursor:pointer}
.m{display:none}
@media (max-width:760px){.d{display:none!important}.m{display:inline}body{--gap:10px}}

/* ---------- desktop skeleton (approved) ---------- */
.screen{position:fixed;inset:var(--bz,0px);border-radius:var(--br,0px);overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transition:background .45s,color .45s}
.bar{position:relative;z-index:40;margin:14px 14px 7px;height:36px;flex:none;border:1px solid var(--line);border-radius:18px;background:var(--dim);padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:500 12.5px var(--mono);transition:background .45s,border-color .45s}
.ws{display:flex;gap:2px}
.ws b{height:24px;line-height:24px;padding:0 10px;border-radius:12px;font-weight:500;transition:background .3s,color .3s}
.ws b:hover{background:var(--bg)} .ws b.on{background:var(--ac);color:var(--bg)}
.rt{display:flex;align-items:center;gap:14px;padding-right:2px}
.rt [data-act]:hover{color:var(--ac)}
.rt .aon{background:var(--ac);color:var(--bg);border-radius:12px;padding:3px 10px;margin:0 -10px} .rt .aon:hover{color:var(--bg)}
.chip{white-space:nowrap;display:flex;align-items:center;gap:7px;background:var(--ac);border-radius:13px;height:26px;padding:0 11px 0 6px;color:var(--bg);font-weight:700;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 35%,transparent),0 0 14px 2px color-mix(in srgb,var(--ac) 45%,transparent);transition:box-shadow .2s,transform .2s}
.chip:hover{transform:scale(1.04)} .rt .chip:hover{color:var(--bg)}
.chip i{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--bg) 0 50%,var(--hot) 0);box-shadow:0 0 0 1.5px var(--bg)}
body.idle .halo{animation:halo 2s ease-in-out 1s infinite}
@keyframes halo{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 55%,transparent),0 0 24px 7px color-mix(in srgb,var(--ac) 60%,transparent)}}
/* status bar toggles: icon buttons with tooltips naming the action and its shortcut */
.tg{display:flex;align-items:center;gap:4px}
.ib{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:background .2s,color .2s}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib:hover,.ib:focus-visible{background:var(--bg);color:var(--ac);outline:none}
.ib.on{color:var(--ac)}
.ib.th i{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--fg) 0 50%,var(--ac) 0);box-shadow:0 0 0 1.5px var(--fg)}
.ib.th{box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 35%,transparent)}
.tip{position:absolute;top:calc(100% + 10px);right:-4px;white-space:nowrap;pointer-events:none;background:var(--fg);color:var(--bg);font:500 12px var(--mono);
  padding:5px 6px 5px 9px;border-radius:8px;display:flex;align-items:center;gap:7px;opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .2s;z-index:46}
.tip::before{content:"";position:absolute;top:-4px;right:13px;width:8px;height:8px;background:inherit;transform:rotate(45deg)}
.tip b{font-weight:700;color:color-mix(in srgb,var(--ac) 55%,var(--bg))}
.tip kbd{font:700 11px var(--mono);border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);border-radius:5px;padding:1px 5px}
.ib:hover .tip,.ib:focus-visible .tip{opacity:1;transform:none;transition-delay:.25s}
@media (hover:none){.tip{display:none}.tip kbd{display:none}}
.tg .ib:nth-child(1){--i:0}.tg .ib:nth-child(2){--i:1}.tg .ib:nth-child(3){--i:2}.tg .ib:nth-child(4){--i:3}
.tip::after{content:"";position:absolute;bottom:100%;right:16.5px;width:1px;height:calc(10px + var(--i)*34px);background:var(--fg);opacity:0;transition:opacity .3s}
body.idle .tip{display:flex;top:calc(100% + 10px + var(--i)*34px);opacity:1;transform:none;transition:none;animation:tipin .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(.5s + var(--i)*.12s)}
body.idle .tip::after{opacity:.5}
body.idle .tip::before{display:none}
@keyframes tipin{from{opacity:0;transform:translateY(-6px)}}
#themes{position:absolute;z-index:45;visibility:hidden;opacity:0;right:10px;top:54px;transform:translateY(-8px);width:min(460px,calc(100% - 20px));background:var(--dim);border:1px solid var(--line);border-radius:16px;padding:12px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;box-shadow:0 20px 60px #0008;font:12px var(--mono);transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1),visibility 0s .3s}
#themes.on{visibility:visible;opacity:1;transform:none;transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.2,1)}
#themes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:10px}
#themes button.on{background:var(--bg);color:var(--ac)}
#themes button i{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.area{position:relative;flex:1;min-height:0;margin:0 7px 7px}
.pane{position:absolute;padding:calc(var(--gap)/2);visibility:hidden}
.win{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);border:2px solid var(--dim);border-radius:14px;transition:border-color .3s,background .45s}
.pane.focus .win{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--ac),var(--hot)) border-box}
.tt{position:absolute;top:10px;left:16px;right:16px;z-index:2;font:11px var(--mono);opacity:.4;pointer-events:none;display:flex;justify-content:space-between}
.win:has(.comp) .tt,.win:has(.b-copy) .tt,.win:has(.photo) .tt,.win:has(.lB) .tt{display:none}
.vD #scrim{backdrop-filter:none}
.body{position:relative;flex:1;min-height:0;container-type:size}
.comp iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;display:block}
.dimt{opacity:.55}
.ac{color:var(--ac)}
.b-name{position:absolute;inset:0;padding:0 4cqw 0 5cqw;display:flex;flex-direction:column;justify-content:center}
.b-name h1{font:700 min(15cqw,30cqh)/.95 var(--mono);letter-spacing:-.045em}
.b-name h1 span{display:block}
.b-name .lab{margin-top:3cqh;font:400 14px var(--mono);color:var(--ac)} .b-name .lab::before{content:"// "}
.b-term{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;white-space:pre-wrap;padding:34px 18px 16px;font:400 14px/1.6 var(--mono)}
.p{color:var(--hot)} .cur{background:var(--fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.b-term a{color:var(--ac)} .b-term a:hover{text-decoration:underline}
.b-term .k{display:inline-block;width:10ch;opacity:.55}
.b-term button{color:var(--ac);opacity:.8}
.b-now{position:absolute;inset:0;padding:16px 18px;display:flex;flex-direction:column;justify-content:flex-end;font:400 14px/1.6 var(--mono)}
.b-now b{color:var(--ac);font-weight:500}
.b-copy{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;padding:28px 24px 22px 5cqw;gap:12px}
.b-copy .kick{font:400 12px var(--mono);opacity:.55}
.b-copy h2{font:700 clamp(28px,13cqw,52px)/1 var(--mono);letter-spacing:-.05em}
.b-copy .pitch{font:500 16px/1.45 var(--mono)}
.b-copy ul{list-style:none;font:400 13px/1.6 var(--mono)} .b-copy ul li::before{content:"+ ";color:var(--ac)}
.b-copy .meta{font:400 12px var(--mono);opacity:.55;margin-top:auto}
.b-copy .links{display:flex;gap:1.4em;flex-wrap:wrap;font:500 13px var(--mono)} .b-copy .links a{color:var(--ac)} .b-copy .links a::before{content:"→ "}
.b-copy .more{color:var(--ac);font:500 13px var(--mono)} .b-copy .more:hover{text-decoration:underline}
.b-stack{position:absolute;inset:32px 0 0;border-top:1px solid var(--dim);font:400 13px/1 var(--mono);display:flex;flex-direction:column}
.b-stack > *{padding:0 14px;flex:1;max-height:34px;display:flex;align-items:center;border-bottom:1px solid var(--dim);gap:1ch;white-space:nowrap;overflow:hidden}
.b-stack > :last-child{border-bottom:0}
.b-stack .on{background:var(--dim);color:var(--ac)} .b-stack .on::before{content:"▸"} .b-stack > :not(.on)::before{content:" ";white-space:pre}
.b-stack .more{opacity:.6} .b-stack .more:hover{opacity:1;color:var(--ac)}
.tag{display:inline-block;font:400 11px/1 var(--mono);padding:3px 7px;border:1px solid var(--line);border-radius:9px;margin:0 4px 4px 0;opacity:.85}
.tag.k{border-color:var(--ac);color:var(--ac)}
.photo{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(60% 50% at 70% 30%,color-mix(in srgb,var(--ac) 45%,transparent),transparent 70%),
  linear-gradient(170deg,color-mix(in srgb,var(--hot) 22%,var(--dim)),var(--dim) 55%,color-mix(in srgb,var(--fg) 12%,var(--dim)))}
.photo::before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:46%;background:color-mix(in srgb,var(--bg) 70%,var(--dim));clip-path:polygon(0 60%,18% 25%,32% 50%,52% 8%,70% 44%,84% 22%,100% 52%,100% 100%,0 100%)}
.photo .pi{position:absolute;top:12px;left:14px;font:11px var(--mono);opacity:.6}
.photo .cap{position:absolute;left:14px;right:14px;bottom:12px;font:500 12px var(--mono);display:flex;justify-content:space-between;gap:1em}
.photo .cap span:last-child{opacity:.6}
.te{display:grid;grid-template-columns:19ch 1fr;column-gap:2ch;padding:14px 0;border-bottom:1px solid var(--dim);position:relative}
.te:last-child{border-bottom:0}
.te .when{font:400 12px/1.6 var(--mono);opacity:.6;grid-column:1} .te .title{font:700 15px/1.6 var(--mono);grid-column:2}
.te .org{grid-column:2;color:var(--ac);font:500 13px/1.6 var(--mono)}
.te p{grid-column:2;font:400 13px/1.6 var(--mono);opacity:.85;margin:.3em 0 .5em;max-width:68ch}
.te .tech{grid-column:2} .te .row{display:contents} .te.now .title{color:var(--ac)}
.il-h .deg{font:700 15px/1.4 var(--mono)} .il-h .uni{color:var(--ac);font:500 13px/1.5 var(--mono)} .il-h .sub{font:12px/1.6 var(--mono);opacity:.6}
.cue{display:inline-flex;align-items:center;gap:1ch;margin-top:12px;font:500 13px var(--mono);color:var(--bg);background:var(--ac);padding:6px 12px;border-radius:14px;box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 30%,transparent)}
.cue .chev{display:inline-block;transition:transform .35s}
.il-open .cue .chev{transform:rotate(90deg)}
.il-body{overflow:hidden} .il-body .te{grid-template-columns:16ch 1fr}
.sk{display:grid;grid-template-columns:auto 1fr;gap:6px 1.5ch;align-items:center;font:400 12.5px var(--mono)}
.sk i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--hot));transform-origin:left}
.sk-more{font:400 12.5px/1.7 var(--mono);margin-top:14px} .sk-more b{font-weight:500;opacity:.55;display:inline-block;width:10ch}
.b-tl{position:absolute;inset:0;overflow:auto;padding:38px 24px 8px 5cqw;scrollbar-width:thin}
.b-il,.b-sk{position:absolute;inset:0;overflow:auto;padding:38px 22px 16px;scrollbar-width:thin}
.sc .b-copy{justify-content:flex-end}

/* ---------- archive: pieces every take shares ---------- */
.aname{color:var(--ac);font-weight:700} a.aname:hover{text-decoration:underline}
.ver{display:inline-block;font:500 11px/1 var(--mono);padding:3px 7px;border-radius:9px;background:var(--dim);color:var(--fg);white-space:nowrap}
.lk{display:flex;gap:1.2em;flex-wrap:wrap;font:500 12.5px var(--mono)} .lk a{color:var(--ac)} .lk a:hover{text-decoration:underline}
.ph-note{font:11px var(--mono);opacity:.45;font-style:italic}
.ahd .kick{font:400 12px var(--mono);opacity:.55} .ahd h2{font:700 clamp(26px,9cqw,44px)/1 var(--mono);letter-spacing:-.05em;margin:.15em 0 .3em} .ahd p{font:500 14px/1.45 var(--mono);opacity:.85}
.xbtn{font:500 12px var(--mono);opacity:.6;white-space:nowrap} .xbtn:hover{opacity:1;color:var(--ac)}
#scrim{position:absolute;inset:0;z-index:20;visibility:hidden;opacity:0;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(3px)}

/* A · Float */
#archA{z-index:25}
#archA .win{box-shadow:0 30px 90px #000a}
.lA{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:22px 26px 18px;scrollbar-width:thin;display:flex;flex-direction:column}
.lA .ahd{display:flex;justify-content:space-between;align-items:flex-start;gap:1em;padding-bottom:14px;border-bottom:1px solid var(--dim)}
.lA .e{display:grid;grid-template-columns:1fr auto;gap:6px 1em;padding:16px 0;border-bottom:1px solid var(--dim)}
.lA .e:last-child{border-bottom:0}
.lA .e .aname{font-size:17px} .lA .e p{grid-column:1/-1;font:500 14px/1.45 var(--mono);max-width:60ch}
.lA .e .ft{grid-column:1/-1;display:flex;gap:1.4em;align-items:center;font:12.5px var(--mono)} .lA .e .ft .lang{opacity:.55}
.lA .e:hover .aname{text-decoration:underline}

/* B · Re-tile (a window in the tiling, a table inside) */
.lB{position:absolute;inset:0;display:flex;flex-direction:column;padding:22px 0 0}
.lB .ahd{display:flex;justify-content:space-between;align-items:flex-start;gap:1em;padding:0 24px 14px 28px}
.lB .tbl{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;border-top:1px solid var(--dim)}
.lB .r{display:grid;grid-template-columns:minmax(20ch,26ch) 1fr 11ch 8ch;gap:0 2ch;padding:13px 24px 13px 28px;border-bottom:1px solid var(--dim);align-items:baseline;font:13px/1.5 var(--mono)}
.lB .r.h{position:sticky;top:0;background:var(--bg);font-size:11px;opacity:.5;padding-top:9px;padding-bottom:9px;z-index:1}
.lB .r .lk{grid-column:2/-1;margin-top:4px}
.lB .r:not(.h):hover{background:color-mix(in srgb,var(--dim) 55%,transparent)}
.lB .r .nm{word-break:break-word}
@container (max-width:620px){.lB .r{grid-template-columns:1fr auto;gap:4px 1ch;padding:12px 16px 12px 18px}.lB .r.h{display:none}.lB .r .pt{grid-column:1/-1;order:3}.lB .r .lg{order:2;opacity:.55;text-align:right}.lB .r .vr{display:none}.lB .r .lk{grid-column:1/-1;order:4}.lB .ahd{padding:0 16px 12px 18px}}

/* C · Own windows */
.hC{position:absolute;inset:0;display:flex;flex-direction:column;padding:28px 24px 22px 5cqw;gap:10px}
.hC .ahd{margin-top:auto}
.hC .back{align-self:flex-start;margin-top:14px}
.eC{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:20px 22px 18px;overflow:hidden}
.eC .ix{font:11px var(--mono);opacity:.45;display:flex;justify-content:space-between}
.eC .aname{font:700 clamp(17px,7cqw,30px)/1.05 var(--mono);letter-spacing:-.04em;color:var(--fg);word-break:break-word}
.pane.focus .eC .aname{color:var(--ac)}
.eC p{font:500 clamp(12.5px,3.4cqw,15px)/1.45 var(--mono);overflow:hidden}
.eC .ft{margin-top:auto;display:flex;gap:1.2em;align-items:center;flex-wrap:wrap;font:12.5px var(--mono)} .eC .ft .lang{opacity:.55}
@container (max-height:150px){.eC p{display:none}}
@container (max-height:95px){.eC .ix{display:none}.eC{padding:12px 14px}}

/* D · Drop-down terminal */
#archD{z-index:25;left:0;top:0;width:100%}
#archD .win{box-shadow:0 30px 80px #0009;border-top-left-radius:6px;border-top-right-radius:6px}
.lD{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:34px 22px 16px;font:400 14px/1.6 var(--mono);scrollbar-width:thin}
.lD .row{display:grid;grid-template-columns:26ch 11ch 8ch 1fr;gap:0 2ch;white-space:normal}
.lD .row.h{opacity:.45}
.lD .row .pt{opacity:.85} .lD .row .lv a{color:var(--ac)} .lD .row .lv a:hover{text-decoration:underline}
.lD .row .lv{grid-column:4;font-size:12.5px;opacity:.9;margin-bottom:.4em}
.lD .hint{opacity:.45;font-size:12px;margin-top:.6em}
@container (max-width:700px){.lD .row{grid-template-columns:1fr auto;gap:0 1ch;margin-bottom:.55em}.lD .row.h{display:none}.lD .row .vr{display:none}.lD .row .lg{opacity:.55;text-align:right}.lD .row .pt,.lD .row .lv{grid-column:1/-1}.lD{font-size:13px;padding:30px 14px 12px}}

@media (max-width:760px){
  .bar{height:40px;border-radius:20px;margin:8px 8px 6px}
  .ws b{padding:0 9px;height:28px;line-height:28px;border-radius:14px}
  .area{margin:0 5px 5px}
  .b-copy{padding:18px 16px 14px;gap:8px} .b-copy ul{display:none}
  .b-term{padding:30px 14px 12px;font-size:12.5px} .b-now{font-size:12.5px;padding:10px 12px}
  .b-stack > *{max-height:none}
  #themes{left:8px;right:8px;width:auto;top:56px}
  .te{grid-template-columns:1fr;padding:12px 0} .te .when,.te .title,.te .org,.te p,.te .tech{grid-column:1} .te .row{display:block}
  .il-body .te{grid-template-columns:1fr}
  .b-tl,.b-il,.b-sk{padding:32px 14px 10px}
  .ctpane .b-term{padding:30px 14px;font-size:12.5px}
  .lA{padding:18px 16px 14px} .lA .e p{font-size:13.5px}
  .hC{padding:18px 16px 14px;gap:6px} .hC p{font-size:13px} .eC{padding:12px 14px;gap:4px}
}

/* CRT (approved): bezel + one WebGL 2 overlay canvas, no curvature */
#crtc{position:absolute;inset:0;width:100%;height:100%;z-index:50;pointer-events:none;mix-blend-mode:multiply;display:none}
body{background:radial-gradient(120% 120% at 50% 40%,#2a2a2d,#0c0c0e 70%);--bz:26px;--br:26px} /* bezel always on: toggling CRT never moves the screen */
.screen{box-shadow:0 0 0 2px #000,0 0 0 6px #1d1d20}
body.crt #crtc{display:block}
@media (max-width:760px){body{--bz:8px;--br:16px}}
body.crt .screen{text-shadow:0 0 .45em color-mix(in srgb,currentColor 40%,transparent);box-shadow:0 0 0 2px #000,0 0 0 6px #1d1d20,0 0 40px 6px color-mix(in srgb,var(--ac) 14%,transparent)}
body.crt .screen::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:55;box-shadow:inset 0 0 28px 0 #0004,inset 0 0 0 2px #0007;background:linear-gradient(160deg,#ffffff0d,transparent 38%)}

/* ---------- switcher + spec (not part of any design) ---------- */
#sw{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:6px;background:#111;color:#fff;border:1px solid #555;border-radius:999px;padding:5px 7px;
  font:500 12px/1 system-ui,sans-serif;box-shadow:0 8px 30px #0008;text-shadow:none;white-space:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
#sw button,#sw select{all:unset;cursor:pointer;height:26px;min-width:26px;padding:0 8px;border-radius:13px;text-align:center;line-height:26px;background:#2a2a2a}
#sw button:hover,#sw button.on{background:#ffd400;color:#000}
#sw #lab{padding:0 6px} #sw i{width:1px;height:18px;background:#555}
#sw.min > :not(#hide){display:none}
@media (max-width:760px){#sw{flex-wrap:wrap;justify-content:center;border-radius:16px;font-size:11px;width:calc(100vw - 16px);bottom:8px}#sw i{display:none}}
#spec{position:fixed;z-index:9998;right:14px;bottom:60px;width:min(420px,calc(100vw - 28px));max-height:calc(100vh - 120px);overflow:auto;background:#111e;color:#eee;border:1px solid #555;border-radius:12px;
  padding:14px 16px;font:12px/1.55 system-ui,sans-serif;display:none;text-shadow:none}
#spec.on{display:block}
#spec h4{font-size:12px;color:#ffd400;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
#spec td{padding:1px 10px 1px 0;vertical-align:top} #spec td:first-child{opacity:.6;white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>
<div id="sw"><button id="vp">←</button><span id="lab"></span><button id="vn">→</button><i></i>
  <button id="ab" title="archive (a)">archive</button><button id="nb" title="entries (n)"></button><i></i>

<script>
/* ---------------- data ---------------- */
const THEMES={

const TL=[

  {roles:[['May – Oct 2022','Senior Software Engineer'],['Nov 2020 – Apr 2022','Full Stack Engineer']],org:'Unsupervised',desc:'Helped design and build a new cloud-native microservice platform for unsupervised machine learning on unstructured customer data. I mentored other engineers and set up the tooling we used for documentation and architecture decisions.',tech:['AWS','Go','Docker','Kubernetes + Helm','gRPC','React + TypeScript']},
  {roles:[['Nov 2019 – Oct 2020','Platform Engineer']],org:'Ibotta',desc:"Built high-throughput microservices for critical transaction data at Denver's first unicorn, an app with over 23m downloads, and kept them within their uptime SLAs.",tech:['Kotlin + Spring','Microservices','AWS','TypeScript','GraphQL']},
  {roles:[['Aug 2018 – Aug 2019','Software Engineer']],org:'Orderly Health',desc:'Joined a two-person engineering team at a health-tech startup and was the solo lead within six months. I delivered an NLP chatbot pilot to clients, then built the APIs, visualisations, demos and scrapers behind the pivot to a data science product.',tech:['React + Redux','Django + MySQL','Data Visualisation','Google Cloud','Docker']},

const CONTACT=['Feel free to get in touch. I always love hearing what people are building, and whether I can help.',' ',
  '<span class="k">email</span><a href="mailto:shrujancheruku@gmail.com">shrujancheruku@gmail.com</a>  <button data-act="copy">[copy]</button>',
  '<span class="k">linkedin</span><a href="https://www.linkedin.com/in/shrujancheruku/" target="_blank">linkedin.com/in/shrujancheruku</a>',
  '<span class="k">github</span><a href="https://github.com/shrujancheruku" target="_blank">github.com/shrujancheruku</a>',
  '<span class="k">resume</span><a href="#">shrujan-cheruku-resume.pdf</a>'];

/* ---------------- shared bits ---------------- */
const W=(id,title,body,cls='',pcls='')=>`<div class="pane ${pcls}" id="p-${id}"><div class="win"><div class="tt">${title}</div><div class="body ${cls}">${body}</div></div></div>`;
const tags=(t,k)=>t.map(x=>`<span class="tag${k?' k':''}">${x}</span>`).join('');
const entry=e=>`<div class="te${e.now?' now':''}">${e.roles.map(([d,t])=>`<div class="row"><div class="when">${d}</div><div class="title">${t}</div></div>`).join('')}
  ${e.org?`<div class="org">${e.org}</div>`:''}<p>${e.desc}</p>${e.tag||e.tech.length?`<div class="tech">${e.tag?tags([e.tag],1):''}${tags(e.tech)}</div>`:''}</div>`;
const ilHead=`<div class="il-h"><div class="deg">${ILH.deg}</div><div class="uni">${ILH.uni} · ${ILH.yrs}</div><div class="sub">${ILH.sub}</div></div>`;
const cue=`<button class="cue" data-act="il"><span class="chev">▸</span><span class="cl">4 earlier roles</span><span class="dimt d" style="color:inherit">· teaching, internships</span></button>`;
const skills=`<div class="sk">${SKILLS.map(([n,v])=>`<span>${n}</span><i style="width:${v*100}%"></i>`).join('')}</div>
  <div class="sk-more"><div><b>languages</b>${LANGS}</div><div><b>hobbies</b>${HOBBIES}</div></div>`;
const photo=i=>`<div class="photo"><span class="pi">photo ${i} · placeholder</span><div class="cap"><span>somewhere · 2026</span><span>${i}</span></div></div>`;
const copy=p=>`<div class="b-copy"><div class="kick">featured ${p.n} / ${NFEAT}</div><h2>${p.slug}</h2><p class="pitch">${p.pitch}</p>
  <ul>${p.proof.map(x=>`<li>${x}</li>`).join('')}</ul><div class="meta">${p.meta}</div><div class="links">${p.links.map(l=>`<a href="#">${l} ↗</a>`).join('')}</div>
  ${p.n===NFEAT?`<div class="more" data-act="archive">+ ${NA} more in the archive →</div>`:''}</div>`;
const sabCopy=`<div class="b-copy"><div class="kick">~/sabbatical</div><div class="dimt" style="font-size:13px">${SAB.when}</div><h2>sabbatical</h2>
  <ul style="display:block">${SAB.lines.map(l=>`<li>${l}</li>`).join('')}</ul><p class="pitch" style="margin-top:auto">${SAB.joke}</p></div>`;
/* archive entry bits */
const repo=a=>`https://github.com/shrujancheruku/${a.n}`;
const nameLink=a=>`<a class="aname" href="${repo(a)}" target="_blank">${a.n}</a>`;
const links=a=>`<span class="lk"><a href="${repo(a)}" target="_blank">repository ↗</a>${a.live?`<a href="https://${a.live}" target="_blank">live ↗</a>`:''}</span>`;
const verChip=a=>a.v?`<span class="ver">${a.v}</span>`:'';
const phn=a=>a.ph?`<span class="ph-note">${a.ph===1?'placeholder':a.ph}</span>`:'';

/* the approved desktop: windows and steps (five workspaces) */
const BASE_W=()=>`
  ${W('name','~ — shrujan',`<div class="b-name"><h1><span>Shrujan</span> <span>Cheruku</span></h1><div class="lab">product engineer</div></div>`)}
  ${W('term','zsh',`<div class="b-term" id="term"></div>`)}
  ${W('now','~/now',`<div class="b-now" data-act="ws" data-w="2"><b>Nov 2025 → now</b><div>sabbatical</div><div class="dimt" style="margin-top:.6em">10/10 would recommend to a friend.</div></div>`)}
  ${W('uc','',copy(PROJ.u))}${W('um','',`<iframe data-comp data-own src="${PROJ.u.comp}" tabindex="-1"></iframe>`,'comp')}
  ${W('oc','',copy(PROJ.o))}${W('om','',`<iframe data-comp src="${PROJ.o.comp}" tabindex="-1"></iframe>`,'comp')}
  ${W('st','featured',`<div class="b-stack">${Object.values(PROJ).map(p=>`<div data-act="go" data-s="${p.n}" data-p="${p.n}">${p.slug}</div>`).join('')}<div class="more" data-act="archive">+${NA} archive</div></div>`)}
  ${W('sc','',sabCopy,'','sc')}
  ${[1,2,3,4].map(i=>W('p'+i,'',photo(i))).join('')}
  ${W('tl','timeline',`<div class="b-tl">${TL.map(entry).join('')}</div>`)}
  ${W('il','education & internships',`<div class="b-il" id="ilA">${ilHead}${cue}<div class="il-body" style="height:0"><div style="padding-top:8px">${IL.map(entry).join('')}</div></div></div>`)}
  ${W('sk','skills',`<div class="b-sk">${skills}</div>`)}
  ${W('ct','contact — zsh',`<div class="b-term" id="cterm"></div>`,'','ctpane')}`;
const S=[
  {ws:0,f:'name',d:{name:[0,0,60,100],term:[60,0,40,58],now:[60,58,40,42]},m:{name:[0,0,100,40],term:[0,40,100,36],now:[0,76,100,24]}},
  {ws:1,f:'um',d:{uc:[0,0,30,68],st:[0,68,30,32],um:[30,0,70,100]},m:{uc:[0,0,100,38],um:[0,38,100,48],st:[0,86,100,14]}},
  {ws:1,f:'om',d:{oc:[0,0,30,68],st:[0,68,30,32],om:[30,0,70,100]},m:{oc:[0,0,100,38],om:[0,38,100,48],st:[0,86,100,14]}},
  {ws:2,f:'sc',d:{sc:[0,0,34,100],p1:[34,0,33,50],p2:[67,0,33,50],p3:[34,50,33,50],p4:[67,50,33,50]},m:{sc:[0,0,100,36],p1:[0,36,50,32],p2:[50,36,50,32],p3:[0,68,50,32],p4:[50,68,50,32]}},
  {ws:3,f:'tl',d:{tl:[0,0,62,100],il:[62,0,38,40],sk:[62,40,38,60]},m:{tl:[0,0,100,60],il:[0,60,100,20],sk:[0,80,100,20]},dOpen:{tl:[0,0,46,100],il:[46,0,54,100]},mOpen:{il:[0,0,100,100]}},
  {ws:4,f:'ct',d:{ct:[0,0,58,100],name:[58,0,42,62],term:[58,62,42,38]},m:{ct:[0,0,100,74],term:[0,74,100,26]}},
];
const STEPS=S.length, WS_FIRST=WS.map((_,w)=>S.findIndex(s=>s.ws===w));

/* ---------------- the four takes of the archive ---------------- */
const mq=matchMedia('(max-width:760px)');
const V={
 A:{name:'Float',
  html:()=>`<div id="scrim" data-act="arch-close"></div>
   <div class="pane float" id="archA"><div class="win"><div class="body"><div class="lA">
    <div class="ahd"><div><div class="kick">${AHEAD.kick} · ${NA}</div><h2>${AHEAD.title}</h2><p>${AHEAD.line}</p></div><button class="xbtn" data-act="arch-close">esc ✕</button></div>
    ${ARCH.map(a=>`<div class="e">${nameLink(a)}${verChip(a)}<p>${a.p}</p><div class="ft">${a.l?`<span class="lang">${a.l}</span>`:''}${links(a)}${phn(a)}</div></div>`).join('')}
   </div></div></div></div>`,
  spec:{Idea:'one window floats above the workspace; the workspace stays tiled behind a dimmed, blurred scrim',
   Where:'desktop: centred, 760px wide at most (70% of the tiling area), up to 86% tall; touch: a sheet rising from the bottom, full width, 86% tall',
   Entry:'a list row per project: name (17px, 700, accent, the repository link) with the version chip on the right; the pitch below at 14px / 1.45 (500); then language · repository ↗ · live ↗',

 B:{name:'Re-tile',

   Opens:'re-tile with the archive arriving last and taking focus',
   Closes:'esc, ✕, the status bar item again, or scrolling to another step (the workspace re-tiles back)'}},
 C:{name:'Own windows',
  html:()=>W('ah','',`<div class="hC"><div class="ahd"><div class="kick">${AHEAD.kick}</div><h2>${AHEAD.title}</h2><p>${AHEAD.line}</p></div>
     <button class="cue back" data-act="arch-close"><span>◂</span><span class="cl">back</span></button></div>`)+
   ARCH.map((a,i)=>W('a'+i,'',`<div class="eC"><div class="ix"><span>${String(i+1).padStart(2,'0')} / ${String(NA).padStart(2,'0')}</span>${verChip(a)}</div>
     ${nameLink(a)}<p>${a.p}</p><div class="ft">${a.l?`<span class="lang">${a.l}</span>`:''}${links(a)}${phn(a)}</div></div>`,'','ae')).join(''),
  spec:{Idea:'the archive takes over the tiling: the workspace\'s windows leave and every project arrives as its own window, so it reads like a sixth, unnumbered workspace',
   Where:'desktop: a heading window on the left (30%, as a project\'s copy) and the entries tiled on the right: one column up to 3, two up to 6, three beyond; touch: heading on top (16%), entries below, two columns from 5',
   Entry:'its own window: index n / N and the version chip on top, the name large (17–30px, 700), the pitch, then language · repository ↗ · live ↗ at the foot. The pitch hides when a window is too short (seen with n)',
   Opens:'the workspace\'s windows fade out, then the archive\'s windows stagger in; hovering an entry gives it focus',
   Closes:'esc, ◂ back, the status bar item again, or scrolling to another step'}},
 D:{name:'Drop-down terminal',
  html:()=>`<div id="scrim" data-act="arch-close"></div>
   <div class="pane float" id="archD"><div class="win"><div class="tt"><span>archive — zsh</span><span>esc ✕</span></div><div class="body"><div class="lD" id="dterm"></div></div></div></div>`,
  spec:{Idea:'a quake-style terminal drops from under the status bar, over the workspace; the workspace stays behind a dimmed scrim (no blur)',
   Where:'desktop: full width of the tiling area, 62% tall (grows with the list up to 92%); touch: the whole tiling area',
   Entry:'ls-style output: one row per project, columns name | language | version | pitch, with repository ↗ · live ↗ under the pitch; narrow: name and language, then pitch, then links',
   Opens:'drops down; the first time per visit it types `ls -l ~/archive` and the rows print one by one; after that it opens printed',
   Closes:'esc, the status bar item again, a click on the scrim, or scrolling to another step'}},
 E:{name:'Chosen · re-tile + float list',
  html:()=>W('ar','',`<div class="lA">
    <div class="ahd"><div><div class="kick">${AHEAD.kick} · ${NA}</div><h2>${AHEAD.title}</h2></div><button class="xbtn" data-act="arch-close">esc ✕</button></div>
    ${ARCH.map(a=>`<div class="e">${nameLink(a)}${verChip(a)}<p>${a.p}</p><div class="ft">${a.l?`<span class="lang">${a.l}</span>`:''}${links(a)}${phn(a)}</div></div>`).join('')}
   </div>`),
  spec:{Idea:'the founder\'s pick: B\'s re-tiling with A\'s list inside',
   Openers:'only from the projects workspace: the "+N archive" line in the featured stack and the line under the last featured project. No status bar item',

   Heading:'"~/archive · N", "archive" and esc ✕; no line under the heading',
   Closes:'esc, ✕, the opener again, or scrolling to another step (the workspace re-tiles back)'}},
};
const vk=V[Q.get('variant')]?Q.get('variant'):'E', v=V[vk];
const RT=vk==='B'||vk==='E';

/* ---------------- state ---------------- */
let picked=!!THEMES[Q.get('theme')], theme=picked?Q.get('theme'):'paper'; /* paper by default, whatever the system preference */
let crt=Q.get('crt')==='0'?0:1, ilOpen=false, archOpen=false, opener=null, openedBy='-';
const save=()=>{const u=new URL(location.href);u.searchParams.set('variant',vk);if(picked)u.searchParams.set('theme',theme);else u.searchParams.delete('theme');
  u.searchParams.set('crt',crt);if(BIG)u.searchParams.set('n',9);else u.searchParams.delete('n');
  if(archOpen)u.searchParams.set('archive',1);else u.searchParams.delete('archive');history.replaceState(null,'',u)};

/* ---------------- DOM ---------------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
document.body.className='v'+vk+' idle';
const woke=()=>{document.body.classList.remove('idle');['pointerdown','keydown','wheel','touchstart'].forEach(e=>removeEventListener(e,woke,true))};
['pointerdown','keydown','wheel','touchstart'].forEach(e=>addEventListener(e,woke,true));
$('#root').innerHTML=`<div class="screen">
  <div class="bar"><div class="ws">${WS.map((n,i)=>`<b data-act="ws" data-w="${i}" title="${n}">${i+1}<span class="d"> ${n}</span></b>`).join('')}</div>
    <div class="rt">${vk==='E'?'':`<span data-act="archive" id="barArch"><span class="d">archive</span><span class="m">▤</span></span>`}<div class="tg">
      <button class="ib" data-act="ws" data-w="0" aria-label="home"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 9.2 10 3.8l6.5 5.4v7.3h-13z"/><path d="M8.2 16.5v-4.2h3.6v4.2"/></svg><span class="tip">home <kbd>H</kbd></span></button>
      <button class="ib" data-act="ws" data-w="4" aria-label="contact"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.8" y="4.8" width="14.4" height="10.4" rx="2"/><path d="m3.4 6 6.6 5 6.6-5"/></svg><span class="tip">contact <kbd>M</kbd></span></button>
      <button class="ib" data-act="crt" id="crtB" aria-label="crt"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.6" y="3.4" width="14.8" height="10.4" rx="2"/><path d="M5.4 6.8h9.2M5.4 9.6h9.2M7.4 16.8h5.2M10 13.8v3"/></svg><span class="tip">crt <b data-crt-state></b> <kbd>C</kbd></span></button>
      <button class="ib th halo" data-act="theme-ui" aria-label="theme"><i></i><span class="tip">theme <b data-theme-name></b> <kbd>T</kbd></span></button>
    </div><span class="clock d"></span></div></div>
  <div class="area">${BASE_W()}${v.html()}</div>
  <div id="themes">${TK.map(k=>`<button data-act="theme-set" data-t="${k}"><i style="background:linear-gradient(135deg,${THEMES[k].bg} 50%,${THEMES[k].ac} 50%)"></i>${k}</button>`).join('')}</div>
  <canvas id="crtc"></canvas>
</div>${'<div class="snap"></div>'.repeat(STEPS)}`;
const PANES=$$('.area > .pane:not(.float)');

/* ---------------- terminals ---------------- */
function typer(el,max=9){let q=Promise.resolve();
  return (cmd,outs=[],fast,gap=0)=>q=q.then(()=>new Promise(res=>{
    const line=document.createElement('div');line.innerHTML='<span class="p">❯ </span><span class="c"></span><span class="cur"> </span>';el.append(line);
    const c=line.querySelector('.c');let i=0;
    const add=o=>{const d=document.createElement('div');d.innerHTML=o;el.append(d);while(el.children.length>max)el.firstChild.remove();return d};
    const done=()=>{line.querySelector('.cur')?.remove();
      if(!gap){outs.forEach(add);return res()}
      let k=0;const iv=setInterval(()=>{if(k>=outs.length){clearInterval(iv);return res()}gsap.from(add(outs[k++]),{opacity:0,x:-6,duration:.3})},gap)};
    if(fast){c.textContent=cmd;return done()}
    const iv=setInterval(()=>{c.textContent=cmd.slice(0,++i);if(i>=cmd.length){clearInterval(iv);setTimeout(done,240)}},42)}))}
const type=typer($('#term'));
type('whoami',['product engineer']);type('cat claim',['I design and build.']);type('cat ask',['Give me a problem, not a spec.']);
const ctype=typer($('#cterm'),20);let contacted=false;

/* ---------------- tiling ---------------- */
let step=-1;
function gridLayout(n,x0,y0,w,h,cols){const rows=Math.ceil(n/cols),L={};
  for(let i=0;i<n;i++){const r=Math.floor(i/cols),c=i%cols,inRow=r===rows-1?n-r*cols:cols,cw=w/inRow;L['a'+i]=[x0+c*cw,y0+r*h/rows,cw,h/rows]}return L}
function layoutOf(s){const st=S[s],m=mq.matches;let L=(ilOpen&&(m?st.mOpen:st.dOpen))||(m?st.m:st.d);
  if(archOpen&&RT){if(m)return {ar:[0,0,100,100]};const o={};for(const k in L){const r=L[k];o[k]=[r[0]*.42,r[1],r[2]*.42,r[3]]}o.ar=[42,0,58,100];return o}
  if(archOpen&&vk==='C'){return m?{ah:[0,0,100,16],...gridLayout(NA,0,16,100,84,NA>4?2:1)}:{ah:[0,0,30,100],...gridLayout(NA,30,0,70,100,NA<=3?1:NA<=6?2:3)}}
  return L}
function focusOf(s){if(archOpen&&RT)return 'ar';if(archOpen&&vk==='C')return 'a0';return S[s].f}
function place(s,dur,order){
  const L=layoutOf(s),f=focusOf(s);let z=1,k=0;
  for(const el of PANES){const id=el.id.slice(2),r=L[id];
    if(r){const to={left:r[0]+'%',top:r[1]+'%',width:r[2]+'%',height:r[3]+'%',zIndex:z++};
      let delay=0;if(order==='archLast'&&id==='ar')delay=.15;if(order==='stagger'&&(id==='ah'||el.classList.contains('ae')))delay=.25+.07*(k++);
      if(!el._vis)gsap.set(el,{...to,scale:.94,autoAlpha:0});
      gsap.to(el,{...to,scale:1,autoAlpha:1,duration:dur,delay:dur?delay:0,ease:'expo.out',overwrite:true});el._vis=true}
    else{if(el._vis)gsap.to(el,{autoAlpha:0,scale:.94,duration:dur*.45,overwrite:true});else gsap.set(el,{autoAlpha:0});el._vis=false}
    el.classList.toggle('focus',f===id)}
  $$('.ws b').forEach((b,i)=>b.classList.toggle('on',i===S[s].ws&&!(archOpen&&vk==='C')));
  $$('.b-stack [data-p]').forEach(d=>d.classList.toggle('on',+d.dataset.p===s));
}
const go=s=>scrollTo({top:s*innerHeight,behavior:'smooth'});
function onScroll(){const s=Math.max(0,Math.min(STEPS-1,Math.round(scrollY/innerHeight)));if(s===step)return;
  const prev=step;step=s;
  if(archOpen&&prev>=0)archClose(true);
  if(ilOpen&&S[s].ws!==3){ilOpen=false;ilRender(0)}
  place(s,prev<0?0:.85);
  if(s===1&&prev!==1)followComps();
  if(prev>=0){if(s===1&&prev<1)type('open unmacos');if(s===2&&prev===1)type('open orca-flow');if(s===0&&prev>0)type('cd ~')}
  if(S[s].ws===4&&!contacted){contacted=true;ctype('contact',CONTACT)}
  if(S[s].ws===3)enterTimeline();
  label()}
addEventListener('scroll',onScroll,{passive:true});
mq.addEventListener('change',()=>{place(step,.5);if(archOpen)floatPlace(0)});
addEventListener('resize',()=>{crtResize();clearTimeout(rz);rz=setTimeout(()=>{place(step,0);if(archOpen)floatPlace(0)},120)});let rz;

/* ---------------- archive open / close ---------------- */
const area=()=>$('.area').getBoundingClientRect();
function relRect(el){const a=area(),r=el.getBoundingClientRect();return {left:r.left-a.left,top:r.top-a.top,width:r.width,height:r.height}}
function floatTarget(){const a=area(),m=mq.matches;
  if(vk==='A'){if(m)return {left:0,top:a.height*.14,width:a.width,height:a.height*.86};
    const w=Math.min(760,a.width*.7),h=Math.min(a.height*.86,Math.max(360,170+NA*118));return {left:(a.width-w)/2,top:(a.height-h)/2,width:w,height:h}}
  if(vk==='D'){if(m)return {left:0,top:0,width:a.width,height:a.height};return {left:0,top:0,width:a.width,height:Math.min(a.height*.92,Math.max(a.height*.46,130+NA*66))}}}
function floatPlace(dur){const el=$('#archA,#archD');if(!el)return;gsap.to(el,{...floatTarget(),duration:dur,overwrite:true})}
let dTyped=false;
function dPrint(){const el=$('#dterm');el.innerHTML='';const t=typer(el,999);
  const rows=[`<div class="row h"><span>name</span><span>language</span><span>version</span><span>pitch</span></div>`,
    ...ARCH.map(a=>`<div class="row"><span>${nameLink(a)}</span><span class="lg">${a.l||'—'}</span><span class="vr">${a.v||'—'}</span><span class="pt">${a.p}</span><span class="lv">${links(a)} ${phn(a)}</span></div>`),
    `<div class="hint">${NA} projects · esc to close</div>`];
  t('ls -l ~/archive',rows,dTyped,dTyped?0:70).then(()=>{const l=document.createElement('div');l.innerHTML='<span class="p">❯ </span><span class="cur"> </span>';el.append(l)});dTyped=true}
function archOpenFn(from){if(archOpen)return;archOpen=true;opener=from||$('#barArch')||$('#p-oc .more');openedBy=opener.closest?.('.bar')?'status bar':opener.closest('.b-stack')?'stack line':'line under last featured project';
  if(vk==='A'||vk==='D'){const el=$(vk==='A'?'#archA':'#archD'),t=floatTarget();
    gsap.to('#scrim',{autoAlpha:1,duration:.3});
    if(vk==='A'){const o=relRect(opener);if(mq.matches)gsap.fromTo(el,{...t,y:t.height,autoAlpha:1},{y:0,duration:.6,ease:'expo.out'});
      else gsap.fromTo(el,{...o,autoAlpha:0},{...t,autoAlpha:1,duration:.6,ease:'expo.out'});
      gsap.from('#archA .e',{y:12,opacity:0,duration:.5,stagger:.05,delay:.2,ease:'expo.out'})}
    else{gsap.fromTo(el,{...t,yPercent:-105,autoAlpha:1},{yPercent:0,duration:.55,ease:'expo.out'});dPrint()}
    el.style.visibility='visible'}
  else place(step,.85,RT?'archLast':'stagger');
  if(RT)gsap.from('#p-ar .e',{y:12,opacity:0,duration:.5,stagger:.05,delay:.35,ease:'expo.out'});
  $('#barArch')?.classList.add('aon');save();label()}
function archClose(quick){if(!archOpen)return;archOpen=false;
  if(vk==='A'||vk==='D'){const el=$(vk==='A'?'#archA':'#archD');gsap.to('#scrim',{autoAlpha:0,duration:.25});
    if(quick)gsap.to(el,{autoAlpha:0,duration:.2});
    else if(vk==='A'){if(mq.matches)gsap.to(el,{y:area().height,duration:.4,ease:'power3.in'});else{const o=relRect(opener);gsap.to(el,{...o,autoAlpha:0,duration:.45,ease:'power3.inOut'})}}
    else gsap.to(el,{yPercent:-105,duration:.4,ease:'power3.in'})}
  else if(!quick)place(step,.85);
  $('#barArch')?.classList.remove('aon');save();label()}
const archToggle=from=>{if(archOpen)return archClose();
  if(vk==='E'&&!from){if(S[step].ws!==1)return go(WS_FIRST[1]+NFEAT-1);from=$('#p-oc .more')}
  archOpenFn(from)};

/* ---------------- timeline + Education & Internships (approved) ---------------- */
let tlEntered=false;
function enterTimeline(){if(tlEntered)return;tlEntered=true;
  gsap.fromTo('.sk i',{scaleX:0},{scaleX:1,duration:1.1,ease:'expo.out',stagger:.08,delay:.4});
  gsap.from('#p-tl .te',{x:-18,opacity:0,duration:.7,stagger:.07,ease:'expo.out',delay:.25})}
function ilRender(animate){const host=$('#ilA');host.classList.toggle('il-open',ilOpen);host.querySelector('.cl').textContent=ilOpen?'hide':'4 earlier roles';
  const b=host.querySelector('.il-body'),kids=b.querySelectorAll('.te');
  if(!animate){gsap.set(b,{height:ilOpen?'auto':0});return}
  if(ilOpen){gsap.fromTo(b,{height:0},{height:'auto',duration:.7,ease:'expo.out',delay:.35});
    gsap.fromTo(kids,{y:16,opacity:0,filter:'blur(4px)'},{y:0,opacity:1,filter:'blur(0px)',duration:.7,stagger:.08,ease:'expo.out',delay:.5})}
  else gsap.to(b,{height:0,duration:.45,ease:'power3.inOut'})}
function toggleIl(){if(S[step].ws!==3){go(WS_FIRST[3]);setTimeout(()=>{ilOpen=true;ilRender(1);place(step,.85)},900);return}
  if(archOpen)archClose(true);ilOpen=!ilOpen;place(step,.85);ilRender(1);label()}

/* ---------------- theme ---------------- */
function applyTheme(){const t=THEMES[theme];for(const k in t)document.documentElement.style.setProperty('--'+k,t[k]);
  $$('[data-theme-name]').forEach(e=>e.textContent=theme);$$('#themes [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===theme));
  $('#ts').value=theme;followComps();save();label()}
const cycle=()=>{picked=true;theme=TK[(TK.indexOf(theme)+1)%TK.length];applyTheme()};
function followComps(){const t=THEMES[theme];
  $$('iframe[data-own]').forEach(f=>{try{f.contentWindow.startTheme?.(theme,[t.bg,t.fg,t.ac,t.dim])}catch{}});
  $$('iframe[data-comp]:not([data-own])').forEach(f=>{const d=f.contentDocument;if(!d||!d.head)return;let s=d.getElementById('follow');
    if(!s){s=d.createElement('style');s.id='follow';d.head.append(s);const l=d.createElement('link');l.rel='stylesheet';l.href=$('#fontcss').href;d.head.append(l)}
    s.textContent=`body{--bg:${t.bg}!important;--fg:${t.fg}!important;--ac:${t.ac}!important;--dim:${t.dim}!important;background:var(--bg)!important;color:var(--fg)!important;font-family:'IBM Plex Mono',monospace!important}
      .term,.tile,.menu,.sb,.keys{font-family:inherit!important}.desk{background:linear-gradient(var(--dim),var(--bg))!important}.monitor .screen{background:var(--bg)!important}`})}
$$('iframe[data-comp]').forEach(f=>f.addEventListener('load',followComps));

/* ---------------- interactions ---------------- */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');
  if(!a){if(!e.target.closest('#themes'))$('#themes').classList.remove('on');return}
  const act=a.dataset.act;
  if(act==='ws'){if(archOpen&&S[step].ws===+a.dataset.w)archClose();go(WS_FIRST[+a.dataset.w])}
  if(act==='go')go(+a.dataset.s);
  if(act==='crt')setCrt(1-crt);
  if(act==='archive')archToggle(a);
  if(act==='arch-close')archClose();
  if(act==='theme-ui'){e.stopPropagation();$('#themes').classList.toggle('on')}
  if(act==='theme-set'){picked=true;theme=a.dataset.t;applyTheme()}
  if(act==='il')toggleIl();
  if(act==='copy'){navigator.clipboard?.writeText('shrujancheruku@gmail.com');ctype('',['copied to clipboard'],true)}
});
$$('.ae').forEach(p=>p.addEventListener('mouseenter',()=>{$$('.ae').forEach(q=>q.classList.toggle('focus',q===p))}));
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowLeft')sw(-1);if(e.key==='ArrowRight')sw(1);
  if(e.key==='a')archToggle();if(e.key==='n')toggleN();
  if(e.key==='t')cycle();if(e.key==='c')setCrt(1-crt);if(e.key==='i')toggleIl();
  if(e.key==='s')$('#spec').classList.toggle('on');
  if(e.key==='h')go(WS_FIRST[0]);if(e.key==='m')go(WS_FIRST[4]);
  if(e.key==='Escape'){archClose();$('#themes').classList.remove('on')}});
const clock=()=>$$('.clock').forEach(c=>c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));clock();setInterval(clock,10000);

/* ---------------- CRT: WebGL 2 overlay (approved, no curvature) ---------------- */
const cv=$('#crtc'),gl=cv.getContext('webgl2',{alpha:false,antialias:false,premultipliedAlpha:false});
let uR,uT,uD;
if(gl){const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,`#version 300 es
    void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}`));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,`#version 300 es
    precision highp float;uniform vec2 R;uniform float T,D;out vec4 o;
    void main(){vec2 uv=gl_FragCoord.xy/R;vec2 p=gl_FragCoord.xy/D;
      float s=.5+.5*cos(p.y*6.2831853/3.);float scan=1.-.24*(1.-s)*(1.-s);
      float c=mod(floor(p.x),3.);vec3 m=c<1.?vec3(1.,.84,.84):c<2.?vec3(.84,1.,.84):vec3(.84,.84,1.);
      float v=mix(.9,1.,pow(16.*uv.x*uv.y*(1.-uv.x)*(1.-uv.y),.35)); /* soft vignette: corners floor at 90% */
      float band=1.-.05*exp(-pow((fract(T*.07)*1.4-.2-(1.-uv.y))*9.,2.));
      float fl=.988+.012*sin(T*97.)*sin(T*13.);
      o=vec4(m*scan*v*band*fl,1.);}`));
  gl.linkProgram(prog);gl.useProgram(prog);uR=gl.getUniformLocation(prog,'R');uT=gl.getUniformLocation(prog,'T');uD=gl.getUniformLocation(prog,'D')}
function crtResize(){if(!gl)return;const d=devicePixelRatio||1;cv.width=cv.clientWidth*d|0;cv.height=cv.clientHeight*d|0;gl.viewport(0,0,cv.width,cv.height)}
function setCrt(n){crt=n;document.body.classList.toggle('crt',crt>0);$('#crtB')?.classList.toggle('on',crt>0);$$('[data-crt-state]').forEach(e=>e.textContent=crt?'on':'off');requestAnimationFrame(()=>{crtResize();place(step,0);if(archOpen)floatPlace(0)});save();label()}
(function loop(t){if(gl&&crt>0){gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,t/1000);gl.uniform1f(uD,devicePixelRatio||1);gl.drawArrays(gl.TRIANGLES,0,3)}requestAnimationFrame(loop)})(performance.now());

/* ---------------- switcher + spec ---------------- */
const keys=Object.keys(V);
function reload(u){u.hash='ws'+(step<0?0:S[step].ws);location.href=u}
function sw(d){const u=new URL(location.href);u.searchParams.set('variant',keys[(keys.indexOf(vk)+d+keys.length)%keys.length]);reload(u)}
function toggleN(){const u=new URL(location.href);if(BIG)u.searchParams.delete('n');else u.searchParams.set('n',9);reload(u)}
$('#vp').onclick=()=>sw(-1);$('#vn').onclick=()=>sw(1);
$('#ab').onclick=()=>archToggle();$('#nb').onclick=toggleN;
$('#ts').innerHTML=TK.map(k=>`<option value="${k}">${k}</option>`).join('');
$('#ts').onchange=e=>{picked=true;theme=e.target.value;applyTheme()};
$('#cb').onclick=()=>setCrt(1-crt);
$('#sb').onclick=()=>$('#spec').classList.toggle('on');
$('#hide').onclick=()=>{$('#sw').classList.toggle('min');$('#hide').textContent=$('#sw').classList.contains('min')?'+':'–'};
function label(){
  $('#lab').textContent=`${vk} · ${v.name}`;
  $('#cb').textContent='CRT: '+['off','on'][crt];$('#cb').classList.toggle('on',crt>0);
  $('#ab').classList.toggle('on',archOpen);$('#nb').textContent=`entries: ${NA}`;$('#nb').classList.toggle('on',BIG);
  $('#spec').innerHTML=`<b>${vk} · ${v.name}</b><table>${Object.entries(v.spec).map(([k,x])=>`<tr><td>${k}</td><td>${x}</td></tr>`).join('')}</table>
    <h4>state</h4><table><tr><td>workspace</td><td>${step<0?'-':S[step].ws+1+' · '+WS[S[step].ws]} (step ${step+1} / ${STEPS})</td></tr>
    <tr><td>archive</td><td>${archOpen?'open · from '+openedBy:'closed'}</td></tr>
    <tr><td>address</td><td>${archOpen?'/archive/':'/'+(step<0?'':WS[S[step].ws]==='opening'?'':WS[S[step].ws]+'/')}</td></tr>
    <tr><td>entries</td><td>${NA}${BIG?' (stress test: rapid-radiology as if replaced + 5 placeholders)':' (the real archive)'}</td></tr>
    <tr><td>layout</td><td>${mq.matches?'touch (one column)':'desktop'} · ${innerWidth}×${innerHeight}</td></tr><tr><td>theme</td><td>${theme}</td></tr></table>
    <h4>shared by every take</h4>name links to the repository · version only when GitHub has one · live link only when wanted · no image · the heading line is placeholder wording
    <h4>keys</h4>← → take · a archive · n 3 ↔ 9 entries · t theme · c CRT · i Education & Internships · s this panel · esc close`}

/* ---------------- boot ---------------- */
history.scrollRestoration='manual';
applyTheme();setCrt(crt);
const startWs=+(location.hash.match(/ws(\d)/)||[])[1]||0;
/* E: /archive/ boots on the last featured project with the archive open */
scrollTo(0,(vk==='E'&&Q.get('archive')==='1'?WS_FIRST[1]+NFEAT-1:WS_FIRST[startWs])*innerHeight);onScroll();
gsap.from('.pane:not([style*="hidden"]) .win',{scale:.7,opacity:0,duration:.9,ease:'expo.out',stagger:.12});
if(Q.get('archive')==='1')setTimeout(()=>archOpenFn(),700);
</script>
