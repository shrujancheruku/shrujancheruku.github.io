<!doctype html><meta charset="utf-8">
<!-- PROTOTYPE composition · issho: the marketing site on a laptop, the app on a phone in front of it. -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="kit.css">
<style>
body{background:radial-gradient(90% 90% at 70% 30%,#232a5c,#11132a 70%)}
.laptop{width:calc(74*var(--u));left:calc(50% - 31*var(--u));top:calc(50% - 25*var(--u))}
.laptop .screen img{height:auto;animation:pan 30s ease-in-out infinite alternate}
@keyframes pan{0%,8%{transform:translateY(0)}92%,100%{transform:translateY(calc(-100% + 44.5*var(--u)))}}
.phone{width:calc(19*var(--u));left:calc(50% - 46*var(--u));top:calc(50% - 13*var(--u));transform:rotate(-4deg);z-index:2}
.phone .screen{background:#14193f}
.phone .screen img{object-fit:contain;object-position:center;opacity:0;transition:opacity .8s}
.phone .screen img.on{opacity:1}
.glow{position:absolute;left:8%;right:8%;bottom:calc(50% - 29*var(--u));height:calc(4*var(--u));background:radial-gradient(50% 100% at 50% 0,#e0a82e55,transparent);filter:blur(calc(1*var(--u)))}
body.card .laptop .screen img{animation:none}
</style>
<div class="glow"></div>
<div class="laptop"><div class="lid"><div class="screen"><img src="../src/issho/site-full.png"></div></div><div class="base"></div></div>
<div class="phone"><div class="screen" id="ph"></div></div>
<script type="module">
import { card } from "./kit.js";
document.body.classList.toggle("card", card);
const names = ["plan","crew","date","going","day","again"], ph = document.getElementById("ph");
ph.innerHTML = names.map((n,i)=>`<img src="../src/issho/${n}-dark.svg" class="${i?"":"on"}">`).join("");
let i = 0; if (!card) setInterval(()=>{ ph.children[i].classList.remove("on"); i=(i+1)%names.length; ph.children[i].classList.add("on"); }, 3200);
</script>
