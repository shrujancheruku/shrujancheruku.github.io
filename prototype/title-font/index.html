<!doctype html>
<!--
  THROWAWAY PROTOTYPE · title font specimen
  Question: the bold monospace "m" clots at title sizes ("unmacos"). Which face should titles of about 24px and up use,
  with IBM Plex Mono kept for everything else?
  Each card is one candidate in the real featured-project window, then the archive heading, a card name and the name.
  Card 1 is today's CSS exactly, including today's tracking. Every other card is at tracking 0 unless its label says so.
  Keys: 1-6 title word · t theme (paper / starship) · click a card to enlarge it, esc to return.
  Fonts load from the Fontsource CDN because this page is thrown away; the winner gets self-hosted.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>title font specimen</title>
<style>
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@5.3.0/latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@5.3.0/latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;src:url(https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@5.3.0/latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'iA Writer Duo';font-weight:700;src:url(https://cdn.jsdelivr.net/fontsource/fonts/ia-writer-duo@5.3.0/latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'iA Writer Quattro';font-weight:700;src:url(https://cdn.jsdelivr.net/fontsource/fonts/ia-writer-quattro@5.3.0/latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Fira Mono';font-weight:700;src:url(https://cdn.jsdelivr.net/fontsource/fonts/fira-mono@5.3.0/latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@5.3.0/latin-700-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
body{-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg);--mono:'IBM Plex Mono',monospace;font-family:var(--mono);padding:14px;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bar{border:1px solid var(--line);border-radius:18px;background:var(--dim);padding:6px 14px;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;font:500 12.5px var(--mono);margin-bottom:14px}
.bar b{font-weight:500;opacity:.55}
.bar button{padding:3px 9px;border-radius:10px} .bar button.on{background:var(--ac);color:var(--bg)}
.bar .sp{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px}
.win{container-type:inline-size;position:relative;display:flex;flex-direction:column;background:var(--bg);border:2px solid var(--dim);border-radius:14px;overflow:hidden;cursor:zoom-in}
.win.pick{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--ac),var(--hot)) border-box}
.lbl{display:flex;justify-content:space-between;gap:1em;padding:10px 16px;border-bottom:1px solid var(--dim);font:500 12px var(--mono)} .lbl span:last-child{opacity:.55;font-weight:400;text-align:right}
/* the real rules from prototype/compositions, with the title face and tracking swapped per card */
.b-copy{display:flex;flex-direction:column;padding:28px 24px 22px 5cqw;gap:12px}
.kick{font:400 12px var(--mono);opacity:.55}
.b-copy h2{font:var(--w) clamp(28px,13cqw,52px)/1 var(--tf);letter-spacing:var(--t-feat)}
.pitch{font:500 16px/1.45 var(--mono)}
.b-copy ul{list-style:none;font:400 13px/1.6 var(--mono)} .b-copy ul li::before{content:"+ ";color:var(--ac)}
.meta{font:400 12px var(--mono);opacity:.55}
.rest{border-top:1px solid var(--dim);padding:18px 24px 22px 5cqw;display:flex;flex-direction:column;gap:16px}
.ahd h2{font:var(--w) clamp(26px,9cqw,44px)/1 var(--tf);letter-spacing:var(--t-arch);margin:.15em 0 .3em} .ahd p{font:500 14px/1.45 var(--mono);opacity:.85}
.aname{font:var(--w) clamp(17px,7cqw,30px)/1.05 var(--tf);letter-spacing:var(--t-card);color:var(--ac);word-break:break-word}
.name{font:var(--w) min(15cqw,64px)/.95 var(--tf);letter-spacing:var(--t-name)} .name span{display:block}
.lab{font:400 14px var(--mono);color:var(--ac);margin-top:8px} .lab::before{content:"// "}
body.zoom .grid{grid-template-columns:1fr} body.zoom .win:not(.pick){display:none} body.zoom .win{cursor:zoom-out;max-width:760px}
</style></head><body>
<div class="bar"><b>title</b><span id="words"></span><b>theme</b><span id="themes"></span><span class="sp"><b>1-6 word · t theme · click a card to enlarge</b></span></div>
<div class="grid" id="grid"></div>
<script>
const THEMES={paper:{bg:'#f2eede',fg:'#222222',ac:'#cc3e28',dim:'#d8d3c0',line:'#b9b29b',hot:'#216609'},
              starship:{bg:'#1c1c1e',fg:'#f5f5f7',ac:'#ff9f0a',dim:'#2c2c2e',line:'#8e8e93',hot:'#ff5f4a'}};
const WORDS=[['unmacos','A keyboard-first desktop for macOS, installed with one command.',['tiling windows, fuzzy menus, terminal apps','23 themes, switched live in every app',"Omarchy's keys, on a Mac"],'Shell · v1.5.0'],
 ['orca-flow','Turn a backlog of issues into reviewed, merged pull requests.',['each ticket goes to the cheapest model that can do it','tickets built side by side, one pull request out','this portfolio was built with it'],'Python · v0.9.1'],
 ['issho','Find your people through the things you already love.',["the activity breaks the ice, so you don't have to",'small groups, matched on what you love','a group that clicks becomes a crew'],'TypeScript · Go'],
 ['rapid-radiology',"Turn a radiologist's shorthand findings into a finished report, in their own words.",['two models, side by side','every normal line kept word for word','a template per report type, 20 types'],'TypeScript'],
 ['sabbatical','Placeholder pitch; only the title matters here.',['placeholder line','placeholder line','placeholder line'],'2026'],
 ['mammoth-swim','Not a project: a stress word with five wide letters.',['m m m','w','placeholder line'],'test']];
const T0={feat:'0',arch:'0',card:'0',name:'0'}, T2={feat:'-.02em',arch:'-.02em',card:'-.02em',name:'-.02em'};
const CANDS=[
 {n:'1 · Plex Mono 700',note:'today, with today\'s tracking',f:"'IBM Plex Mono'",w:700,t:{feat:'0',arch:'-.05em',card:'-.04em',name:'-.045em'}},
 {n:'2 · Plex Mono 500',note:'same font, lighter · the fallback',f:"'IBM Plex Mono'",w:500,t:T0},
 {n:'3 · iA Writer Duo Bold',note:'Plex with a 1.5-cell m and w',f:"'iA Writer Duo'",w:700,t:T0},
 {n:'3b · iA Writer Duo Bold',note:'tracking -0.02em',f:"'iA Writer Duo'",w:700,t:T2},
 {n:'4 · iA Writer Quattro Bold',note:'four widths: narrow i and l too',f:"'iA Writer Quattro'",w:700,t:T0},
 {n:'4b · iA Writer Quattro Bold',note:'tracking -0.02em',f:"'iA Writer Quattro'",w:700,t:T2},
 {n:'5 · Fira Mono 700',note:'true mono, short middle stem on m',f:"'Fira Mono'",w:700,t:T0},
 {n:'6 · JetBrains Mono 700',note:'true mono, already in the compositions',f:"'JetBrains Mono'",w:700,t:T0}];
const Q=new URLSearchParams(location.search);
let wi=Math.max(0,WORDS.findIndex(w=>w[0]===Q.get('word'))), theme=THEMES[Q.get('theme')]?Q.get('theme'):'paper';
const $=s=>document.querySelector(s);
function draw(){
  const [w,pitch,proof,meta]=WORDS[wi], th=THEMES[theme];
  for(const k in th)document.body.style.setProperty('--'+k,th[k]);
  $('#words').innerHTML=WORDS.map((x,i)=>`<button class="${i===wi?'on':''}" data-w="${i}">${i+1} ${x[0]}</button>`).join('');
  $('#themes').innerHTML=Object.keys(THEMES).map(k=>`<button class="${k===theme?'on':''}" data-th="${k}">${k}</button>`).join('');
  const pick=document.querySelector('.win.pick')?.dataset.i;
  $('#grid').innerHTML=CANDS.map((c,i)=>`<div class="win${String(i)===pick?' pick':''}" data-i="${i}" style="--tf:${c.f},var(--mono);--w:${c.w};--t-feat:${c.t.feat};--t-arch:${c.t.arch};--t-card:${c.t.card};--t-name:${c.t.name}">
    <div class="lbl"><span>${c.n}</span><span>${c.note}</span></div>
    <div class="b-copy"><div class="kick">featured 2 / 4</div><h2>${w}</h2><p class="pitch">${pitch}</p><ul>${proof.map(p=>`<li>${p}</li>`).join('')}</ul><div class="meta">${meta}</div></div>
    <div class="rest"><div class="ahd"><div class="kick">~/archive · 9</div><h2>archive</h2><p>Selected, not featured. Hand-ordered.</p></div>
      <div class="aname">TrueCrypt-Steganography</div><div class="aname">placeholder-six-with-a-long-name</div>
      <div><div class="name"><span>Shrujan</span><span>Cheruku</span></div><div class="lab">product engineer</div></div></div></div>`).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'), w=e.target.closest('.win');
  if(b?.dataset.w){wi=+b.dataset.w;draw()} else if(b?.dataset.th){theme=b.dataset.th;draw()}
  else if(w){const on=document.body.classList.toggle('zoom');document.querySelectorAll('.win').forEach(x=>x.classList.toggle('pick',on&&x===w))}
});
document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<=String(WORDS.length)){wi=+e.key-1;draw()}
  if(e.key==='t'){theme=theme==='paper'?'starship':'paper';draw()}
  if(e.key==='Escape'){document.body.classList.remove('zoom');document.querySelectorAll('.win').forEach(x=>x.classList.remove('pick'))}
});
draw();
</script></body></html>
