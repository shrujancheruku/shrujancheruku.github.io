<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- PROTOTYPE composition · rapid-radiology: pick a Report Type, type shorthand Findings, generate, and two Reports
     arrive side by side. What came from the Findings is in the accent; the rest is the Normal Template, word for word.
     Takes: A the app in a browser frame · B the app is the window · C three tiled panes read left to right.
     Wording is the repository's own demo data for CT Chest. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="kit.css">
<style>
body{font-size:calc(1.3*var(--u));line-height:1.55}
#rig{position:absolute;inset:0;display:flex;flex-direction:column}
#chrome,.backdrop{display:none}
#app{flex:1;min-height:0;display:grid;grid-template:auto 1fr/1fr 1fr;gap:calc(1.2*var(--u));padding:calc(1.4*var(--u))}
#in{grid-column:1/-1}
.pn{padding:calc(1.5*var(--u)) calc(1.9*var(--u))}
h3{font-size:calc(1.4*var(--u));margin-bottom:calc(.7*var(--u));display:flex;gap:1ch;align-items:baseline}
h3::before{content:"▪";color:var(--ac)}
h3 small{font-weight:400;opacity:.5;font-size:calc(1.1*var(--u));margin-left:auto}
.types{display:flex;gap:calc(.7*var(--u));flex-wrap:wrap;margin-bottom:calc(1.2*var(--u))}
.types span{border:calc(.15*var(--u)) solid var(--dim);border-radius:99px;padding:calc(.15*var(--u)) calc(1.2*var(--u));font-size:calc(1.15*var(--u));transition:.3s}
.types span.on{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700}
#f{white-space:pre-wrap;min-height:calc(1.3*1.55*4*var(--u) + 2*var(--u));border:calc(.15*var(--u)) solid var(--dim);border-radius:calc(.8*var(--u));padding:calc(1*var(--u)) calc(1.3*var(--u));transition:border-color .3s}
#f.live{border-color:var(--ac)}
.foot{display:flex;align-items:center;gap:2ch;margin-top:calc(1*var(--u))}
.btn{background:var(--ac);color:var(--bg);font-weight:700;border-radius:calc(.8*var(--u));padding:calc(.4*var(--u)) calc(1.5*var(--u));transition:transform .15s,filter .15s;white-space:nowrap}
.btn.press{transform:scale(.93);filter:brightness(1.25)}
.key{font-size:calc(1.1*var(--u));opacity:0;transition:opacity .5s}.key.on{opacity:.7}.key b{color:var(--ac)}
.r div{opacity:0;transform:translateY(.4em);transition:.35s;margin-bottom:.15em}.r div.in{opacity:.6;transform:none}
.r div.new.in{opacity:1}.r mark{background:none;color:var(--ac);font-weight:500}
.still .r div{transition:none}
/* A · browser frame */
.tA .backdrop{display:block}
.tA #rig{inset:calc(4*var(--u)) calc(5*var(--u));border:calc(.22*var(--u)) solid var(--line);border-radius:calc(1.4*var(--u));overflow:hidden;background:var(--bg);box-shadow:0 calc(2*var(--u)) calc(6*var(--u)) #0003}
.tA #chrome{display:flex;align-items:center;gap:calc(.7*var(--u));height:calc(3.6*var(--u));padding:0 calc(1.4*var(--u));background:var(--dim);font-size:calc(1.1*var(--u));flex:none}
#chrome i{width:calc(1*var(--u));height:calc(1*var(--u));border-radius:50%;background:var(--line)}
#chrome span{margin-left:calc(1.5*var(--u));background:var(--bg);border-radius:99px;padding:0 calc(1.6*var(--u));opacity:.8}
/* C · tiled, left to right */
.tC #app{grid-template:1fr/0.9fr 1fr 1fr}.tC #in{grid-column:auto;display:flex;flex-direction:column}.tC .types span:not(.on){display:none}
.tC #f{flex:1}.tC .foot{flex-direction:column;align-items:flex-start;gap:calc(.8*var(--u))}.tC{font-size:calc(1.42*var(--u))}
@media (max-width:520px){#app,.tC #app{grid-template:auto 1fr/1fr;padding:calc(1*var(--u));gap:calc(1*var(--u))}#in,.tC #in{grid-column:1;display:block}
  .types span:not(.on){display:none}.tA #rig{inset:0;border:0;border-radius:0}.tA #chrome,.backdrop{display:none!important}
  /* touch reads in two beats: the findings are typed, then the report takes their place */
  body:not(.done) #pa{display:none}.done #in h3:nth-of-type(2),.done #f,.done .btn{display:none}.done .types{margin-bottom:calc(.4*var(--u))}.done .foot{margin:0}.done #in h3:first-child{display:none}
  #app,.tC #app{grid-template:auto 1fr/1fr!important}body:not(.done) #app{grid-template:1fr/1fr!important}
  #f{min-height:calc(1.3*1.55*3*var(--u) + 2*var(--u))}.pn{padding:calc(1.1*var(--u)) calc(1.4*var(--u))}}
</style>
<div class="backdrop"></div>
<div id="rig">
  <div id="chrome"><i></i><i></i><i></i><span>rapid-radiology · new report</span></div>
  <div id="app">
    <section class="pn" id="in"><h3>Report Type</h3><div class="types" id="ty"></div><h3>Findings <small class="wide">your shorthand</small></h3><div id="f"></div>
      <div class="foot"><span class="btn" id="go">Generate Reports</span><span class="key" id="key"><b>■</b> from your findings<span class="wide"> · the rest is your template, word for word</span></span></div></section>
    <section class="pn" id="pa"><h3>OpenAI Report <small class="wide">full sentences</small></h3><div class="r" id="a"></div></section>
    <section class="pn wide" id="pb"><h3>Gemini Report <small>near-verbatim</small></h3><div class="r" id="b"></div></section>
  </div>
</div>
<script type="module">
import { $, sleep, still, typeInto } from "./kit.js";
const types = ["CT Chest", "CT Abdomen and Pelvis", "MRI Knee", "MRI Brain", "US Abdomen"];
const findings = "comparison CT chest 14 March 2025\nleft lower lobe consolidation with air bronchograms\nsmall left pleural effusion\n4mm right upper lobe nodule, stable from prior";
// [[...]] marks what the Findings changed; everything else is the radiologist's own Normal Template
const A = ["[[Comparison is made to previous imaging dated 14 March 2025.]]", "The central airways are patent.", "[[Left lower lobe consolidation with air bronchograms. 4 mm right upper lobe nodule, stable from prior.]] No suspicious lung nodules.", "[[Small left pleural effusion.]] No pneumothorax.", "Normal heart size. No pericardial effusion.", "Normal calibre thoracic aorta and main pulmonary artery.", "No enlarged mediastinal, hilar or axillary lymph nodes.", "Visualised upper abdomen unremarkable.", "No aggressive osseous lesions."];
const B = ["[[Comparison is made to previous imaging dated 14 March 2025.]]", "The central airways are patent.", "[[Left lower lobe consolidation with air bronchograms.]]", "[[4mm right upper lobe nodule, stable from prior.]] No new suspicious lung nodules.", "[[Small left pleural effusion.]] No pneumothorax.", "Normal heart size. No pericardial effusion.", "Normal calibre thoracic aorta and main pulmonary artery.", "No enlarged mediastinal, hilar or axillary lymph nodes.", "Visualised upper abdomen unremarkable.", "No aggressive osseous lesions."];
const fill = (el, L) => el.innerHTML = L.map(t => `<div class="${t.includes("[[") ? "new" : ""}">${t.replace(/\[\[/g, "<mark>").replace(/\]\]/g, "</mark>")}</div>`).join("");
const focus = (...ids) => document.querySelectorAll(".pn").forEach(p => p.classList.toggle("focus", ids.includes(p.id)));
for (;;) {
  $("#ty").innerHTML = types.map(t => `<span>${t}</span>`).join(""); $("#f").textContent = ""; fill($("#a"), A); fill($("#b"), B); $("#key").classList.remove("on"); document.body.classList.remove("done"); focus("in");
  await sleep(900); $("#ty").children[0].classList.add("on"); await sleep(700);
  $("#f").classList.add("live"); await typeInto($("#f"), findings, 42); $("#f").classList.remove("live");
  await sleep(500); $("#go").classList.add("press"); await sleep(220); $("#go").classList.remove("press"); await sleep(450); document.body.classList.add("done"); focus("pa", "pb");
  for (let i = 0; i < B.length; i++) { $("#a").children[i]?.classList.add("in"); await sleep(110); $("#b").children[i].classList.add("in"); await sleep(170); }
  await sleep(300); $("#key").classList.add("on");
  if (still) break; await sleep(7500);
}
</script>
