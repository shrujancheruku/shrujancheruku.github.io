<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- PROTOTYPE composition · issho: the marketing site and the app, both drawn by hand from text and shapes in the
     site's type and theme colours (no captures, no screenshots). The six steps are one cycle: the site scrolls
     through them while the app pane shows the step half a cycle away, so the two never show the same step.
     Takes: A laptop and phone · B the site is the window, phone in front · C three tiled panes (site, app, steps). -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="kit.css">
<style>
#sv{container-type:inline-size;background:var(--bg)}
#pg{position:absolute;left:0;top:0;width:100%;will-change:transform;transition:transform 1.3s cubic-bezier(.65,0,.2,1);font-size:1.85cqw;line-height:1.6;padding:3.5cqw 5cqw 6cqw 11cqw}
#pg::before{content:"";position:absolute;left:6.5cqw;top:9cqw;bottom:0;width:.35cqw;background:var(--dim)}
.logo{font-weight:700;letter-spacing:.3em;font-size:1.9cqw;display:flex;align-items:center;gap:1.2cqw}.logo i{width:2.2cqw;height:2.2cqw;border-radius:50%;background:var(--hot)}
.hero{padding:7cqw 0 9cqw}.hero h1{font-size:6.6cqw;line-height:1.05;letter-spacing:-.05em;max-width:14ch}.hero p{max-width:44ch;opacity:.65;margin:2cqw 0 2.6cqw}
.cta{display:inline-block;background:var(--ac);color:var(--bg);font-weight:700;border-radius:.6em;padding:.35em 1.1em}
.sec{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:4cqw;padding:3cqw 0 6cqw;align-items:start}
.sec::before{content:"";position:absolute;left:-5.65cqw;top:3.2cqw;width:2cqw;height:2cqw;border-radius:50%;background:var(--bg);border:.35cqw solid var(--line);transition:.4s}
.sec.at::before{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 .8cqw color-mix(in srgb,var(--ac) 25%,transparent)}
.sec small{font-size:1.5cqw;opacity:.6}.sec h2{font-size:3.5cqw;line-height:1.12;letter-spacing:-.04em;margin:.3em 0 .6em}.sec p{opacity:.65;font-size:1.65cqw}
.sec .c{font-size:1.5cqw}
/* a card: the same drawing serves the site (small) and the app (large); everything inside is in em */
.c{border:.12em solid var(--dim);border-radius:1em;padding:1.1em 1.2em;background:color-mix(in srgb,var(--dim) 35%,var(--bg));line-height:1.5;transition:background .45s,border-color .45s}
.c h4{font-size:1.15em;line-height:1.25;letter-spacing:-.02em}.c .s{opacity:.6;font-size:.88em}
.c .btn{display:block;text-align:center;background:var(--ac);color:var(--bg);font-weight:700;border-radius:.6em;padding:.45em;margin-top:.9em}
.c .ghost{display:block;text-align:center;font-size:.88em;opacity:.6;margin-top:.5em;text-decoration:underline}
.map{display:block;width:100%;border-radius:.7em;margin:.8em 0;background:var(--dim)}
.map .st{stroke:var(--bg);stroke-width:2.5;fill:none}.map .pond{fill:color-mix(in srgb,var(--ac) 30%,var(--dim))}
.map .rt{stroke:var(--ac);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:0}
.stops{list-style:none;border-left:.14em solid var(--ac);margin-left:.3em;padding-left:1em}.stops li{position:relative;margin-bottom:.45em}
.stops li::before{content:"";position:absolute;left:-1.42em;top:.4em;width:.55em;height:.55em;border-radius:50%;background:var(--bg);border:.14em solid var(--ac)}
.dash{display:inline-flex;gap:.35em;margin-left:.8em;vertical-align:middle}.dash i{width:1.1em;height:.3em;border-radius:9px;background:var(--ac)}.dash i:last-child{background:var(--dim)}
.grid{display:grid;grid-template-columns:2.6em repeat(3,1fr);gap:.35em;margin:.9em 0;font-size:.85em;align-items:center}
.grid span{opacity:.6;text-align:center}.grid b{font-weight:400;opacity:.6}
.grid i{height:2em;border-radius:.4em;background:var(--dim);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--bg);font-size:.9em}
.grid i.m{background:color-mix(in srgb,var(--fg) 28%,var(--dim))}.grid i.pick{background:var(--ac)}
.ring{display:block;width:62%;margin:.6em auto}.ring circle{fill:none;stroke-width:2.5}.ring .tr{stroke:var(--dim);stroke-dasharray:3 5}.ring .arc{stroke:var(--ac);stroke-dasharray:239;stroke-dashoffset:125;stroke-linecap:round}
.ring .av{fill:color-mix(in srgb,var(--dim) 35%,var(--bg));stroke:var(--ac)}.ring .no{stroke:var(--line);stroke-dasharray:3 3}.ring text{fill:var(--fg);font:700 26px 'IBM Plex Mono',monospace;text-anchor:middle}.ring .sm{font-size:5.5px;font-weight:400;opacity:.7}
.chat{border:.12em solid var(--dim);border-radius:.8em;padding:.8em;margin:.8em 0;background:var(--bg);display:flex;flex-direction:column;gap:.5em;min-height:8.5em}
.chat div{max-width:82%;border-radius:.8em;padding:.4em .8em;background:var(--dim)}.chat .me{align-self:flex-end;background:var(--ac);color:var(--bg)}
.row2{display:flex;gap:.6em}.row2 .btn{flex:none;padding:.45em 1em;margin:0}.row2 .out{border:.12em solid var(--line);border-radius:.6em;padding:.4em .8em;font-size:.9em;flex:1;text-align:center}
.pk{display:flex;justify-content:space-between;align-items:center;border-top:.1em solid var(--dim);padding:.5em 0}
.pk i{width:1.2em;height:1.2em;border-radius:.25em;border:.12em solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.8em;color:transparent}.pk i.y{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.crew{background:var(--ac);color:var(--bg);border-radius:.8em;padding:1em;margin:-.2em -.3em .9em}.crew .ln{display:flex;justify-content:space-between;margin-top:.9em;position:relative}
.crew .ln::before{content:"";position:absolute;left:1em;right:1em;top:50%;height:.12em;background:var(--bg);opacity:.5}
.crew .ln b{position:relative;width:2.6em;height:2.6em;border-radius:50%;background:var(--bg);color:var(--ac);display:grid;place-items:center;font-size:.85em}
/* the app: one screen at a time */
#pv{container-type:size;background:var(--bg)}
.scrn{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:5cqw;font-size:min(4.1cqw,3.3cqh);opacity:0;transition:opacity .6s}
.scrn.on{opacity:1}
.scrn.on .rt{animation:draw 2.2s .3s both ease-in-out}@keyframes draw{from{stroke-dashoffset:520}}
.scrn.on .y{animation:pop .4s both}.scrn.on .pk:nth-of-type(3) .y{animation-delay:.9s}.scrn.on .pk:nth-of-type(5) .y{animation-delay:1.6s}
.scrn.on .chat div:nth-of-type(1){animation:up .4s .8s both}.scrn.on .chat div:nth-of-type(2){animation:up .4s 1.7s both}
.scrn.on .arc{animation:arc 1.4s .4s both}@keyframes arc{from{stroke-dashoffset:239}}
.scrn.on .grid .pick{animation:pop .4s .9s both}
.scrn.on .crew b{animation:pop .4s both}.scrn.on .crew b:nth-child(2){animation-delay:.5s}.scrn.on .crew b:nth-child(3){animation-delay:.8s}.scrn.on .crew b:nth-child(4){animation-delay:1.1s}
@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes up{from{transform:translateY(.6em);opacity:0}}
.still *{transition:none!important;animation:none!important}
#steps{display:none}
/* A · laptop and phone */
.tA #lap{position:absolute;width:calc(72*var(--u));left:calc(50% - 31*var(--u));top:calc(50% - 25*var(--u))}
.tA #lid{background:#222;border:calc(.22*var(--u)) solid var(--line);border-bottom:0;border-radius:calc(1.6*var(--u)) calc(1.6*var(--u)) 0 0;padding:calc(1.1*var(--u)) calc(1.1*var(--u)) calc(1.4*var(--u))}
.tA #sv{aspect-ratio:16/10;border-radius:calc(.5*var(--u))}
.tA #base{height:calc(1.5*var(--u));margin:0 calc(-5*var(--u));background:linear-gradient(var(--line),color-mix(in srgb,var(--line) 55%,var(--bg)));border-radius:calc(.3*var(--u)) calc(.3*var(--u)) calc(1.6*var(--u)) calc(1.6*var(--u))}
.tA #ph{width:calc(20*var(--u));left:calc(50% - 45*var(--u));top:calc(50% - 11*var(--u));transform:rotate(-4deg);z-index:2}
/* B · the site is the window */
.tB .backdrop,.tC .backdrop{display:none}
.tB #lap{position:absolute;inset:0}.tB #lid{height:100%}.tB #sv{height:100%}
.tB #ph{width:calc(24*var(--u));right:calc(5*var(--u));bottom:calc(-3*var(--u));transform:rotate(3deg);z-index:2}
/* C · tiled */
.tC{display:grid;grid-template:1fr auto/1.7fr 1fr;gap:calc(1.2*var(--u));padding:calc(1.2*var(--u))}
.tC #lap{grid-row:1/3;border:calc(.2*var(--u)) solid var(--dim);border-radius:calc(1.3*var(--u));overflow:hidden;min-height:0}
.tC #lid,.tC #sv{height:100%}
.tC #ph{position:relative;border:calc(.2*var(--u)) solid var(--dim);border-radius:calc(1.3*var(--u));background:var(--bg);box-shadow:none;padding:0;min-height:0;overflow:hidden;background:var(--bg)!important}
.tC #pv{aspect-ratio:auto;height:100%;border-radius:0}
.tC #steps{display:block;padding:calc(1.4*var(--u)) calc(1.8*var(--u));font-size:calc(1.25*var(--u));line-height:1.75}
#steps div{display:flex;gap:1.2ch;opacity:.5;transition:opacity .3s,color .3s}#steps div.on{opacity:1;color:var(--ac);font-weight:700}
#steps div::before{content:attr(data-n)}
#steps div::after{margin-left:auto;font-weight:400;font-size:calc(1.05*var(--u));opacity:.7}
#steps div.at{opacity:.9}#steps div.at::after{content:"site"}#steps div.on::after{content:"app"}
/* touch: every take reads as the site with the phone in front */
@media (max-width:520px){body{display:block!important;padding:0!important}.backdrop,#steps,#base{display:none!important}
  #lap{position:absolute!important;inset:0!important;width:auto!important;border:0!important;border-radius:0!important}#lid{height:100%;border:0!important;padding:0!important;background:none!important}#sv{height:100%;aspect-ratio:auto!important;border-radius:0!important}
  #pg{font-size:2.6cqw}.sec{grid-template-columns:1fr;padding-right:42cqw}.sec .c{display:none}.sec h2{font-size:5cqw}.sec p{font-size:2.6cqw}.hero h1{font-size:8cqw}.hero p{max-width:26ch}
  #ph{position:absolute!important;width:calc(21*var(--u))!important;left:auto!important;top:auto!important;right:calc(2.5*var(--u));bottom:calc(-2*var(--u));transform:rotate(3deg)!important;padding:calc(.7*var(--u))!important;background:#222!important;border:calc(.22*var(--u)) solid var(--line)!important;box-shadow:0 calc(2*var(--u)) calc(5*var(--u)) #0006!important}
  #pv{aspect-ratio:404/644!important;height:auto!important;border-radius:calc(2*var(--u))!important}.scrn{font-size:min(5cqw,3.6cqh);padding:5cqw 4cqw}}
</style>
<div class="backdrop"></div>
<div id="lap"><div id="lid"><div id="sv" class="scr"><div id="pg"></div></div></div><div id="base"></div></div>
<div id="ph" class="phone"><div id="pv" class="scr"></div></div>
<div id="steps" class="pn"></div>
<script type="module">
import { $, sleep, still } from "./kit.js";
const dots = n => `<span class="dash">${"<i></i>".repeat(n)}</span>`;
// one drawing per step, used small on the site and large in the app
const CARDS = [
  `<h4>Photo walk from Kichijoji station, ending at a café</h4><div class="s">Kichijoji · about 2.5 hours</div>
   <svg class="map" viewBox="0 0 200 110"><path class="st" d="M0 22H200M0 58H200M0 92H200M38 0V110M92 0V110M150 0V110M0 0L200 70"/><ellipse class="pond" cx="78" cy="70" rx="46" ry="17" transform="rotate(-12 78 70)"/>
   <path class="rt" d="M158 14L172 40L168 78L120 96L60 92L30 74L44 56L96 48L128 60L112 76"/><circle cx="158" cy="14" r="4" fill="var(--bg)" stroke="var(--ac)" stroke-width="2"/></svg>
   <ul class="stops"><li>Kichijoji Station, park exit <span class="s">· meet here</span></li><li>Inokashira Park <span class="s">· 90 minutes of photos</span></li><li>A café on Nanaibashi-dori</li></ul><b>4 of 5 going</b>${dots(5)}`,
  `<h4>When people can go</h4><div class="s">The darker the slot, the more people are free.</div>
   <div class="grid"><b></b><span>Morning</span><span>Afternoon</span><span>Evening</span><b>Fri</b><i></i><i></i><i class="m"></i><b>Sat</b><i class="m"></i><i class="pick">2 PM</i><i class="m"></i><b>Sun</b><i class="m"></i><i></i><i></i></div><b>Sat, Nov 15, 2:00 PM</b>`,
  `<h4>Can you go?</h4><div class="s">Please answer by Thu, Nov 13 · Sat, Nov 15, 2:00 PM</div>
   <svg class="ring" viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="38"/><circle class="arc" cx="50" cy="50" r="38" transform="rotate(170 50 50)"/><text x="50" y="56">3</text><text class="sm" x="50" y="67">confirmed so far</text>
   <circle class="av" cx="12.6" cy="56.6" r="6"/><circle class="av" cx="25.6" cy="20.9" r="6"/><circle class="av" cx="74.4" cy="20.9" r="6"/><circle class="av no" cx="87.4" cy="56.6" r="6"/><circle class="av no" cx="50" cy="88" r="6"/></svg>
   <span class="btn">I can go</span><span class="ghost">I cannot go</span>`,
  `<h4>It's today: check in when you arrive</h4><div class="s">Kichijoji Station, park exit · 2:00 PM</div>
   <div class="chat"><span class="s">Group chat · Aoi, Kenji, Maya, Sam and you</span><div>Maya: I'm by the ticket gates, green jacket.</div><div class="me">Two stops away, excited to meet you all!</div></div>
   <div class="row2"><span class="btn">I'm here</span><span class="out">Share with someone you trust</span></div>`,
  `<h4>Who would you meet again?</h4><div class="s" style="margin-bottom:.8em">Private: nobody sees who you pick.</div>
   <div class="pk">Aoi<i class="y">✓</i></div><div class="pk">Kenji<i>✓</i></div><div class="pk">Maya<i class="y">✓</i></div><div class="pk">Sam<i>✓</i></div>`,
  `<div class="crew"><div class="s" style="opacity:.85">A crew for you</div><h4>Photo walk crew</h4><div class="ln"><b>A</b><b>M</b><b>S</b><b>You</b></div></div>
   <b>You got on well. Keep meeting as a crew?</b><div class="s">Something you all love: photo walks.</div><span class="btn">Yes, join the crew</span><span class="ghost">No, thanks</span>`,
];
// the six steps, in the site's own words: [kicker, heading, body]
const STEPS = [
  ["It starts with a plan", "Pick something you'd do anyway.", "Photo walks, bouldering, ramen crawls, board-game cafés. The activity breaks the ice, so you don't have to."],
  ["Date set", "Enough of you said yes. It's on.", "When enough people can make the same time, we lock in a date and split everyone into small groups."],
  ["Going", "A few people, not a crowd.", "Confirm your place and see who's coming. Groups stay small, so everyone gets a word in."],
  ["On the day", "Show up. The activity does the talking.", "The group chat opens ahead of time, so you can say hi and spot each other at the gates."],
  ["How was it?", "Pick who you'd meet again. Privately.", "Nobody sees your picks. Pick each other, and you're more likely to share a group again."],
  ["A crew", "Strangers on Saturday, regulars by spring.", "Clicked with your group? We'll offer you a crew: your own group chat, with a fresh plan every week or so."],
];
const pg = $("#pg"), pv = $("#pv");
pg.innerHTML = `<div class="logo"><i></i>ISSHO</div><div class="hero"><h1>Find your people through the things you already love.</h1>
  <p>Tell us what you love. We'll find a few people nearby who love it too, and a time and place to do it together.</p><span class="cta">Join the waitlist</span></div>` +
  STEPS.map(([k, h, p], i) => `<div class="sec"><div><small>${k}</small><h2>${h}</h2><p>${p}</p></div><div class="c">${CARDS[i]}</div></div>`).join("");
pv.innerHTML = CARDS.map(c => `<div class="scrn"><div class="c">${c}</div></div>`).join("");
$("#steps").innerHTML = STEPS.map(([k], i) => `<div data-n="${i + 1}">${k}</div>`).join("");
// The six steps are one cycle. The site and the app are half a cycle apart, so they never show the same step:
// while the site is on step k (with the next steps in view below it), the app shows step k+3.
const OFFSET = 3, secs = [...pg.querySelectorAll(".sec")];
const STOPS = [[-1, 0, 2200], ...STEPS.map((_, i) => [i, i])]; // [section to scroll to (-1 is the top), the site's step, hold ms]
let at = 0;
const show = i => { at = i; const [sec, k] = STOPS[i], ak = (k + OFFSET) % 6, max = Math.max(0, pg.offsetHeight - $("#sv").offsetHeight);
  const top = sec < 0 ? 0 : secs[sec].offsetTop - .03 * $("#sv").offsetWidth;
  pg.style.transform = `translateY(${-Math.min(top, max)}px)`;
  secs.forEach((s, j) => s.classList.toggle("at", j === k && sec >= 0));
  [...pv.children].forEach((s, j) => s.classList.toggle("on", j === ak));
  [...$("#steps").children].forEach((d, j) => { d.classList.toggle("on", j === ak); d.classList.toggle("at", j === k); }); };
addEventListener("resize", () => show(at));
await document.fonts.ready;
show(0);
if (!still) for (;;) for (let i = 0; i < STOPS.length; i++) { show(i); await sleep(STOPS[i][2] || 3600); }
</script>
