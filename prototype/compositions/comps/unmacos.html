     hand-written text. Windows open, tile, move and close from the keyboard, and the theme switches live.

     one beat, then switches through the site's seven. It is the same in every take (it never had a device). -->

async function menu(title, items, query, pick) {
  const m = $("#menu"), draw = q => { const f = items.filter(i => i.includes(q)); m.innerHTML = `<span class="a">${title}</span> <span class="d">${f.length} / ${items.length}</span>\n<b>❯ ${q}</b><span class="cur"></span>\n` + f.slice(0, 6).map(i => `<div class="${i === pick ? "sel" : ""}"> ${i === pick ? "<b class='a'>●</b>" : " "} ${i}</div>`).join(""); };
  draw(""); m.classList.add("on"); await sleep(500);
  for (let i = 1; i <= query.length; i++) { draw(query.slice(0, i)); await sleep(170); }
  await sleep(450); m.classList.remove("on"); await sleep(150);
}
const apps = ["btop", "firefox", "ghostty", "lazygit", "nvim", "orca", "spotify_player"], themes = ["catppuccin", "everforest", "gruvbox", "kanagawa", "nord", "rose-pine", "tokyo-night"];
// Starts with the desktop already in use. Every beat moves a window AND switches the theme, so both read at once;
// one window opens and closes inside the cycle. Nothing resets, so the loop has no visible seam.
(card ? ["nvim", "btop", "spotify_player", "lazygit"] : ["nvim", "btop", "spotify_player"]).forEach(a => spawn(a, true)); focus = tiles[0]; layout(); tick(); if (!card) setInterval(tick, 1000);
const beat = async key => { // move + theme together
  await keys(`${k("alt", "shift", key)} move · ${k("alt", "ctrl", "shift", "space")} theme`, 350);
  const [a, b, c, ...rest] = tiles; tiles = [c, a, b, ...rest]; focus = c; layout();
  if (Date.now() > held) theme(order[ti = (ti + 1) % order.length]); await sleep(1900);
};
if (!card) { await sleep(900); for (;;) {
  await beat("h");
  await keys(`${k("alt", "space")} launch an app`, 400); await menu("apps", apps, "laz", "lazygit"); spawn("lazygit"); await sleep(1300);
  await beat("j");
  focus = tiles.at(-1); layout(); await keys(`${k("alt", "w")} close the window`, 700); await close(); focus = tiles[0]; layout(); await sleep(900);
  await beat("l");
} }
</script>
